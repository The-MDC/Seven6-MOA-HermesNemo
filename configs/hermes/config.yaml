    # Unsloth's own measurement for this quant is 94.35% top-1 token agreement with BF16 and a
    # mean KLD of 0.027; that is fidelity to BF16, NOT a coding benchmark. The only same-harness
    # coding figure this repo has is the Vals AI SWE-bench Verified board for GLM-5.3-Flash
    # (bash-only mini-SWE-agent harness; archived, saturated, so it ranks models and does not
