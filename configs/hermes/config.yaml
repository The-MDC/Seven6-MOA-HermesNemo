  llamacpp-glm-q5:
    name: "llama.cpp (GLM-5.3-Flash stock, UD-Q5_K_XL, over an SSH tunnel) -- the CODER"
    # THE CODER CHOICE (2026-10-21, on request): Unsloth's stock GLM-5.3-Flash at UD-Q5_K_XL is
