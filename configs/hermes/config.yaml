    # Run on the big box: scripts/q8-local-fetch.sh ultra, then scripts/q8-local-serve.sh ultra.
    #
    # "Q8+" is Unsloth's UD-Q8_K_XL: 14 shards, 594,513,314,336 B (plain Q8_0 is 584.3 GB and
    # shares shards 1-12 with it). Sizes and sha256 read from the Hub 2026-10-21. Text only; Unsloth's
    # page says MTP is not supported for GGUFs, so the serve script has no speculation for it.
