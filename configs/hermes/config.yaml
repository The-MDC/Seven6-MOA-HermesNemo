# Hermes Agent -- Seven6-MOA [Nemo-Hermes]. One primary model, NVIDIA Nemotron 3.5 Super VL
# on NVIDIA NIM, serves every role that routes inference; OpenRouter and local
# Ollama are failover, and Anthropic-direct is kept configured but unrouted.
#
# Copy to ~/.hermes/config.yaml (back up whatever is there first), then run
#     scripts/nim-preflight.sh
# before you trust it. The preflight proves the key works, proves traffic lands on
# NVIDIA and not somewhere else, and reports what the endpoint actually supports.
#
# NO KEY GOES IN THIS FILE. Every remote provider reads `key_env`. Put them in
# ~/.hermes/.env (chmod 600) or export them:
#     NVIDIA_API_KEY=nvapi-...      https://build.nvidia.com  -> "Get API Key"
#     OPENROUTER_API_KEY=sk-or-v1-...   https://openrouter.ai/keys
#     ANTHROPIC_API_KEY=sk-ant-...  https://console.anthropic.com/settings/keys
#       Optional. Enables `anthropic-direct` (see providers: below), which is NOT
#       wired into any tier by default -- absence changes nothing else. USE A KEY
#       DEDICATED TO THIS PROVIDER, distinct from whatever authenticates Claude
#       Code or any other Anthropic surface on this machine: two consumers on one
#       account is invisible to both of them until a bill or a rate limit says
#       otherwise, which is the exact failure `openai-codex` is excluded below to
#       prevent for ChatGPT. Same shape, different vendor.
# The local tier needs no key at all — it is a server on your own machine.
#
# ---------------------------------------------------------------------------
# THE SHAPE
#
# Current state and open items: docs/models/HANDOFF-NEXT-SESSION.md. This file is the
# reconciled target, not a record of what any deployment drifted into.
#
#   parent      NVIDIA NIM     nemotron-3.5-super-vl-120b-a12b  -- THE primary model,
#                              2026-10-19, on request ("the nemotron 3.5 Super VL
#                              should be the only gateway and inference")
#   subagents   NVIDIA NIM     nemotron-3.5-super-vl-120b-a12b  same model, same bucket
#   vision      NVIDIA NIM     nemotron-3.5-super-vl-120b-a12b  it is a VL model;
#                              pinned, never `auto` -- see auxiliary.vision
#   aggregator  NVIDIA NIM     nemotron-3.5-super-vl-120b-a12b  ACTS on a MoA turn
#                              (2026-10-20, on request; Ultra held this slot
#                              2026-10-19 and is now a reference)
#   moa refs    OpenRouter     z-ai/glm-5.3-flash, mistralai/mixtral-8x22b-instruct
#               NVIDIA NIM     ising-calibration-1.5-31b, nemotron-3-nano-omni-30b-a3b-reasoning,
#                              nemotron-3-ultra-550b-a55b  -- see the moa: block
#   fallback    OpenRouter     z-ai/glm-5.3-flash         1st link in fallback_providers
#               Hugging Face   NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4   2nd link (2026-10-21,
#                              on request: "Keep OpenRouter as a fallback, followed by Hugging
#                              Face"; the primary's NVFP4 build through HF's router -- see
#                              providers.hf-fallback)
#               llama.cpp      Nemotron 3.5 Super VL 120B Q8_0 (nemotron-3.5-super-vl-120b-a12b-q8)
#                              3rd link (2026-10-21, on request: load the Q8+ models, aggregator
#                              unchanged): the primary's weights on a box you run, tunnel on
#                              127.0.0.1:8082 -- see providers.llamacpp-supervl-q8
#               llama.cpp      Qwen3.8-27B Q8_0 (qwen3.8-27b-q8)   4th link (2026-10-21, on request;
#                              a server you run on a big box and reach over an SSH tunnel on
#                              127.0.0.1:8081 -- see providers.llamacpp-qwen)
#               NVIDIA NIM     nvidia/nemotron-3.5-lightning-30b-a3b         5th link (2026-10-19, on request;
#                                                         replaces the local 49B, which an
#                                                         8 GB machine cannot load). Same
#                                                         bucket as the parent -- see the
#                                                         invariant below
#   opt-in refs llama.cpp      nemotron-3-ultra-550b-a55b-q8 (UD-Q8_K_XL) and glm-5.3-flash-q8 (Q8_0),
#                              tunnels 8083 and 8084: the moa.presets.local-q8 preset only; the
#                              default preset keeps the hosted copies
#   coder       llama.cpp      glm-5.3-flash-q5 (Unsloth stock GLM-5.3-Flash, UD-Q5_K_XL), tunnel 8086:
#                              the chosen coding model; reachable by /model, in no preset, fallback or tier
#   opt-in slot llama.cpp      glm-5.3-flash-abliterated-q5 (huihui-ai GGUF, UD-Q5_K_XL), tunnel 8085:
#                              reachable only by /model; in no preset, no fallback, no tier
#   floor       your laptop    Hermes-3-Llama-3.2-3B-abliterated:Q8_0 (Ollama)
#                              last link in fallback_providers, plus the five light
#                              auxiliary slots (title, approval, mcp, skills_hub,
#                              curator) -- kept off the NIM bucket on purpose
#   heavy aux   OpenRouter     qwen/qwen3.8-27b           compression, web_extract (the hosted copy
#                              of the same model fallback 4 serves locally; kept off the
#                              tunnel on purpose -- see the auxiliary: block)
#   unrouted    Anthropic      claude-sonnet-5            anthropic-direct: configured,
#                              intact, reachable only via /model
#
# THE INVARIANT: one model per bucket. A slot may share the parent's provider only on
# the parent's exact model, and only vision among the auxiliaries may. The FIRST
# fallback must sit on a different endpoint from the parent, because a 429 on NIM
# cannot be answered from NIM. One named exception, for a LATER link: nvidia/nemotron-3.5-lightning-30b-a3b
# on NIM (2026-10-19, on request). It spends the parent's bucket, so it answers a
# model-level failure of the parent (retired id HTTP 410, a 5xx on that model) and NOT
# a 429. CI requires such a link to be non-first, to differ from the parent's model,
# and to be listed under providers.nvidia-nim.models.
#
# WHY THE OPENROUTER ENTRY IS CALLED or-fallback.
# `deepseek` and `openrouter` are both in `excluded_providers` below.
# `excluded_providers` matches case-insensitively against every key a provider
# can surface under, so naming either directly -- `provider: deepseek`, or an
# entry called `openrouter` -- would be hidden by its own exclusion and silently
# resolve to the main model. Routing through a provider whose NAME is not
# excluded is what makes this work.
#
# VERIFY BEFORE TRUSTING, things this file cannot check:
#   1. That Ollama has actually pulled the floor model
#      (`hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0`) -- see the
#      `local` provider's comment for the pull command. A model listed here but
#      absent on the machine is exactly the dangling reference CI rejects in config
#      and cannot detect on disk. scripts/hermes-verify.ps1 checks it.
#   2. That NVIDIA_API_KEY can call nvidia/nemotron-3.5-lightning-30b-a3b (fallback 5). The public
#      listing says the id exists; it does not say THIS key may call it:
#          curl -s https://integrate.api.nvidia.com/v1/models/nvidia/nemotron-3.5-lightning-30b-a3b
#          NVIDIA_NIM_MODEL=nvidia/nemotron-3.5-lightning-30b-a3b bash scripts/nim-preflight.sh
#   3. That NVIDIA_API_KEY can see EVERY NVIDIA model this file routes to --
#      the primary and the three NIM MoA references (Ising, Omni, Ultra):
#          bash scripts/nim-preflight.sh --list | grep -iE 'super-vl|ising|nano-omni|ultra-550b'
#          curl -s https://integrate.api.nvidia.com/v1/models/nvidia/nemotron-3-ultra-550b-a55b
#      (no key; HTTP 200 = served, 410 = retired and the body gives the date;
#      repeat for nvidia/ising-calibration-1.5-31b and the nano-omni id)
#          NVIDIA_NIM_MODEL=nvidia/nemotron-3-ultra-550b-a55b bash scripts/nim-preflight.sh
#      A catalog that lists a model for one key can omit it for another, and the
#      public catalog listing says nothing about whether THIS key may call a 550B.
#   4. That OPENROUTER_API_KEY can call the two OpenRouter MoA references, fallback 1
#      and the two heavy aux slots (z-ai/glm-5.3-flash, mistralai/mixtral-8x22b-instruct,
#      qwen/qwen3.8-27b). The public catalog lists them (checked 2026-10-21); it does
#      not say THIS key may call them:
#          curl -s https://openrouter.ai/api/v1/models | grep -o '"id":"qwen/qwen3.8-27b"'
#   5. That the llama.cpp servers behind fallbacks 3 and 4 (and the opt-in Ultra and GLM
#      references) are up AND that the SSH tunnels to them are open. Nothing in this file can see either. A dead tunnel is not an error: Hermes
#      skips the link and tries the next one. `pwsh scripts/hermes-verify.ps1 -Deep`
#      probes it and WARNS (never fails) when it is down.
#   6. That HF_TOKEN can CALL the Hugging Face fallback (fallback 2). It must be a token
#      with the "Make calls to Inference Providers" permission. The catalog cannot show
#      that: GET https://router.huggingface.co/v1/models answers HTTP 200 with no token and
#      with a bogus one (checked 2026-10-21). Only a chat completion tells them apart:
#          bash scripts/nim-preflight.sh        (sends a one-token chat to the HF router)
# ---------------------------------------------------------------------------

providers:

  nvidia-nim:
    name: "NVIDIA NIM (build.nvidia.com)"
    api: https://integrate.api.nvidia.com/v1
    key_env: NVIDIA_API_KEY
    transport: chat_completions
    # Run after every NVIDIA model swap -- a retired id answers HTTP 410, not a
    # config error:
    #     bash scripts/nim-preflight.sh --list | grep -i nemotron
    #
    # PRIMARY MODEL, 2026-10-19, on request: nvidia/nemotron-3.5-super-vl-120b-a12b
    # carries parent, subagents, MoA reference and vision (see model:, delegation:,
    # moa:, auxiliary.vision). The other NVIDIA models routed to are three MoA
    # REFERENCES (Ising, Omni, Ultra, below) and fallback 5 (Lightning); GLM-5.3 Flash
    # and Mixtral instruct go through OpenRouter. Everything else in this file is an
    # unrouted gateway kept intact on request (anthropic-direct), failover only
    # (or-fallback, local), or a deliberate non-NIM side job (see auxiliary:).
    #
    # LIVE-VERIFIED: GET https://integrate.api.nvidia.com/v1/models (no key needed)
    # returned HTTP 200 with 81 models on 2026-10-19 and listed exactly this id.
    # 120B total / ~12B active ("a12b"), hybrid Mamba-2 + MoE + attention,
    # vision-language (image, video, text in; text out), up to 1M tokens per the
    # model card. This id is THIS GATEWAY'S. The same weights carry other ids
    # elsewhere -- do not paste these into this entry:
    #     Vercel AI Gateway           nvidia/nemotron-3.5-super-vl
    #     Hugging Face / Baseten      nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B
    #     local served alias          nemotron-3.5-super-vl
    # A forum report says the hosted endpoint once answered under a different
    # model id than the one requested. UNVERIFIED -- scripts/nim-preflight.sh
    # probes this id and checks the reply names it.
    #
    # SAMPLING: NVIDIA's card recommends temperature 1.0, top_p 0.95; model:
    # below is set to match. Reasoning is toggled per request (`enable_thinking`),
    # not by a different id.
    #
    # ONE BUCKET. Parent, subagents, the MoA aggregator, vision and three of the
    # five MoA references (Ising, Omni, Ultra) all spend this key's ~40 RPM together. The CI block requires any auxiliary or
    # delegation slot sharing the parent's provider to use the SAME model as the
    # parent. MoA references are the sanctioned exception; CI requires each one
    # to be listed under its provider's models: and the aggregator to differ from every reference. A fan-out can
    # starve the parent -- keep delegation.max_concurrent_children low, and see
    # credential_pool_strategies for adding a second key (same provider, fill_first).
    #
    # MOA REFERENCE (it was the aggregator until 2026-10-20): nvidia/nemotron-3-ultra-550b-a55b.
    # LIVE-VERIFIED the same way: GET /v1/models lists it, and GET /v1/models/<id>
    # (no key) returns HTTP 200 for BOTH NVIDIA ids in this file. That per-id
    # endpoint also says WHY an id is dead: HTTP 410 with the end-of-life date for
    # a retired model, 404 for one NIM never had. 550B total / 55B active, hybrid
    # Mamba-Attention LatentMoE, GA 2026-06-04, "up to 1M" context (256k default
    # serving config; not measured on this endpoint), OpenMDW-1.1. TEXT IN, TEXT
    # OUT: unlike Super VL it cannot take an image. Reasoning is ON by default
    # (`enable_thinking`, plus a cheaper `medium_effort`); NVIDIA samples it at
    # temperature 1.0, top_p 0.95 -- the same as the primary. Same id on OpenRouter
    # (`nvidia/nemotron-3-ultra-550b-a55b`); Hugging Face and Baseten spell it
    # `nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4`.
    #
    # NIM hosts nothing between 120B and 550B that could stand in for Ultra: the
    # large Nemotrons are 120B (Super), 253B (Llama-3.1-Nemotron-Ultra, marked
    # Deprecated), 340B (Nemotron-4) and 550B. The one 235B Nemotron-named model
    # (nvidia/Qwen3-Nemotron-235B-A22B-GenRM) is a reward model that scores two
    # replies; it does not act or call tools.
    #
    # NOT MEASURED HERE: whether this key may call the 550B at all, its latency, and
    # whether NVIDIA gives it a lower rate cap than the 120B. Run the second
    # preflight command in the VERIFY block at the top of this file before relying
    # on it.
    #
    # `nvidia/nemotron-3-nano-omni-30b-a3b-reasoning` stays in `models:` for the
    # /model picker and is routed nowhere.
    # FALLBACK 5: nvidia/nemotron-3.5-lightning-30b-a3b (2026-10-19, on request; replaces the local 49B).
    # Chosen over z-ai/glm-5.3-flash the same evening, on request ("it may need a smaller or
    # different model"). 30B total / ~3B active by its id. It is the ONLY Lightning size NIM,
    # OpenRouter and Hugging Face list; there is no 120B Lightning.
    # LIVE-VERIFIED: GET /v1/models lists it, and GET /v1/models/nvidia/nemotron-3.5-lightning-30b-a3b
    # (no key) returned HTTP 200 on 2026-10-19. NOT MEASURED: its context length on
    # this endpoint (context_length below is provider-wide), its tool-calling
    # behaviour, whether THIS key may call it, and its rate cap. It shares the
    # parent's bucket, so it covers a failure of the parent MODEL, not a 429 (see
    # THE INVARIANT at the top). It is listed here because CI requires it.
    default_model: nvidia/nemotron-3.5-super-vl-120b-a12b
    models:
      - nvidia/nemotron-3.5-super-vl-120b-a12b
      - nvidia/nemotron-3-ultra-550b-a55b
      - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - nvidia/nemotron-3.5-lightning-30b-a3b
      # MoA reference (2026-10-20, on request): vision, quantum, reviewer. NVIDIA's
      # Ising Calibration VLM (Gemma-4 base, image-text-to-text, licence "other"),
      # tuned on quantum-processor calibration plots. GET /v1/models/<id> returned
      # HTTP 200 on 2026-10-20. A specialist, so it advises; it is NOT the
      # auxiliary.vision model, which stays pinned to the parent (see auxiliary).
      - nvidia/ising-calibration-1.5-31b
      # CODER (2026-10-21, on request: "coding to be the GLM 5.3 with support or review by our
      # top Nemo model"). Z.ai's GLM-5.3, hosted by NVIDIA. It is the ACTING model of the opt-in
      # moa.presets.coder preset and of nothing else: not the parent, not a subagent, not an
      # auxiliary, not a fallback. LIVE-VERIFIED only that GET /v1/models/z-ai/glm-5.3 (no key)
      # returned HTTP 200 on 2026-10-21. NOT MEASURED: whether THIS key may call it, its context
      # length, its tool calling, its rate cap. Run
      #   NVIDIA_NIM_MODEL=z-ai/glm-5.3 bash scripts/nim-preflight.sh --nim-only
      # before relying on it. The hosted NIM trial is for evaluation (NVIDIA API Trial Terms).
      - z-ai/glm-5.3
    discover_models: false
    # nim-preflight.sh reports what the endpoint advertises. Set this to the number
    # it prints. The preflight defaults to the model above; NVIDIA_NIM_MODEL
    # overrides it if you need to probe a different one.
    #
    # CONTEXT LENGTH NOT RE-VERIFIED FOR nemotron-3.5-super-vl. 131072 is carried
    # over unchanged from the previous entry. The model card claims up to 1M tokens,
    # but a card is not an endpoint: raise this only to the number nim-preflight.sh
    # measures on this account. A value too LOW wastes window; too HIGH overflows
    # on a rejected request.
    context_length: 131072
    # NOT ENABLED. NVIDIA's cookbook says tool calling with reasoning on needs
    # `force_nonempty_content: true` in chat_template_kwargs, or `content` can
    # come back empty beside a tool call. Whether the HOSTED endpoint accepts
    # the field is unverified, and a rejection (HTTP 400/422) would fail every
    # turn on the only gateway. Run `bash scripts/nim-preflight.sh`; when its
    # "reasoning on + force_nonempty_content" probe prints `ok`, uncomment:
    # extra_body:
    #   chat_template_kwargs:
    #     force_nonempty_content: true

  or-fallback:
    name: "OpenRouter"
    api: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    transport: chat_completions
    # The 429 escape hatch, AND the workhorse for the two heavy auxiliary slots
    # (compression, web_extract). Both jobs land on one model on purpose.
    # 2026-10-21, on request: Qwen3.5-122B-A10B is replaced by Qwen3.8-27B. Checked
    # against openrouter.ai/api/v1/models the same day: 1,000,000 context, text+image+
    # video in, tools + reasoning supported, $0.04 in / $1.35 out per MTok. The
    # context_length below is held at 262,144 (the model's native window) rather than
    # the listed million; raise it only once `hermes-verify.ps1 -Deep` shows the
    # endpoint honours more.
    default_model: qwen/qwen3.8-27b
    models:
      - qwen/qwen3.8-27b
      # 2026-10-20, on request. Verified against openrouter.ai/api/v1/models the same
      # day: 1,048,576 context, text+image+video in, tools supported,
      # $0.047 in / $0.16 out per MTok. MoA reference 1, advisor, and FALLBACK 1.
      - z-ai/glm-5.3-flash
      # 2026-10-20, on request: "instruct version". NIM lists only the BASE
      # mistralai/mixtral-8x22b-v0.1, so the instruct model lives here. 65,536
      # context (NOT the provider-wide figure below), tools supported,
      # $2 in / $6 out per MTok. MoA reference: support and review.
      - mistralai/mixtral-8x22b-instruct
    discover_models: false
    # Held at the parent's window rather than the architectural million, for the
    # same reason: raise it to what the endpoint advertises, not the model card.
    context_length: 262144

  hf-fallback:
    name: "Hugging Face (Inference Providers router)"
    api: https://router.huggingface.co/v1
    key_env: HF_TOKEN
    transport: chat_completions
    # FALLBACK 2 (2026-10-21, on request: "Keep OpenRouter as a fallback, followed by
    # Hugging Face"). The primary's own model on a THIRD bucket: HF's router fronts
    # Baseten, which serves the NVFP4 build of Nemotron 3.5 Super VL. Checked against
    # GET https://router.huggingface.co/v1/models the same day (134 models): text+image
    # in, tools supported, 1,048,576 context, one provider (Baseten), status live,
    # $0.20 in / $0.50 out per MTok. It answers a 429 on NIM AND on OpenRouter, keeps
    # vision, and unlike fallbacks 3 and 4 it needs no tunnel and no machine of yours running.
    #
    # THE MODEL ID BELONGS TO THIS GATEWAY. It is not NIM's
    # (nvidia/nemotron-3.5-super-vl-120b-a12b), not OpenRouter's
    # (nvidia/nemotron-3.5-super-vl) and not the BF16 repo's. It is the NVFP4
    # quantization, so treat it as the same model for routing, not as a bit-identical
    # one: its numerics differ from the primary's.
    #
    # THE KEY. HF_TOKEN needs the "Make calls to Inference Providers" permission, and
    # Inference Providers usage is billed to the HF account. GET /v1/models answers
    # HTTP 200 with no token and with a bogus one (checked), so a catalog probe cannot
    # tell a good token from a bad one; a chat completion can (HTTP 401 without a
    # token, checked). hermes-verify.ps1 -Deep and nim-preflight.sh therefore send a
    # one-token chat. The router picks among the providers the account allows; Baseten
    # is the only one listed for this id today.
    #
    # UNVERIFIED: no completion has been sent to this endpoint from this repo (no HF
    # token in the build sandbox). compression.model_thresholds needs no new key:
    # "nemotron-3.5-super-vl" matches this id by case-insensitive substring.
    default_model: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    models:
      - nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    discover_models: false
    # Held at the primary's window rather than the listed million, for the reason the
    # other fallbacks are: raise it to what the endpoint honours, not to a listing.
    context_length: 131072

  local:
    name: "Ollama (this machine)"
    # Ollama's OpenAI-compatible endpoint. `ollama serve` -> 11434.
    # Note this provider is named `local`, NOT `ollama`: `ollama` is in
    # excluded_providers below to hide the built-in catalog entry, and a provider
    # named the same as its own exclusion hides itself.
    api: http://127.0.0.1:11434/v1
    # Loopback only. No key_env because there is no key: a server on your own
    # machine authenticates nothing. The CI check that forbids inline keys exempts
    # loopback hosts for exactly this reason.
    api_key: "no-key-required"
    transport: chat_completions
    # PULLED VIA OLLAMA'S OWN HF-DIRECT FEATURE, not a manual GGUF download +
    # Modelfile:
    #     ollama pull hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
    # The full string becomes the model's tag in `ollama list` and is exactly
    # what belongs in `default_model`/`models:` below -- Ollama does not rename
    # it. Needs a reasonably current Ollama (the hf.co/ pull path); check
    # `ollama --version` if the pull is rejected. Q8_0 is 3,421,895,840 bytes
    # (~3.42 GB), checked against the Hugging Face repo 2026-09-25.
    #
    # "ABLITERATED" IS A REAL BEHAVIOR CHANGE, NOT A BRANDING DETAIL. This is a
    # refusal-removed fine-tune -- its safety training was deliberately ablated.
    # It backs every local-routed auxiliary slot below, `auxiliary.approval`
    # included. It is the auxiliary workhorse (see `auxiliary:` below): routing,
    # classification, short structured output, tool selection.
    default_model: hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
    models:
      - hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
      # The 49B Nemotron GGUF (~58.68 GB) was fallback 2 until 2026-10-19. Removed:
      # the target machine has 8 GB of RAM, and no hosted endpoint serves that model.
    discover_models: false
    # Llama-3.2-3B is text-only (Llama 3.2's vision variants are the 11B/90B line),
    # so there is no local vision. `auxiliary.vision` is cloud-routed; offline
    # vision does not exist in this build.
    #
    # KV cache is what hurts on a laptop, not the weights, so this sits far below
    # the model's native window. Raise it only as far as RAM tolerates. It was
    # sized for the 3B floor model. 32768 is a conservative floor, not a measured
    # optimum.
    context_length: 32768

  llamacpp-qwen:
    name: "llama.cpp (Qwen3.8-27B Q8_0, over an SSH tunnel)"
    # FALLBACK 4 (2026-10-21, on request: "the best q8 you can find on HF ... and all
    # accompanying files"). Qwen3.8-27B is a dense 27B vision-language model (Apache
    # 2.0, 262,144 native context). It does NOT fit this 8 GB laptop (the Q8_0 is
    # 28.6 GB), so it runs on a bigger machine and this entry points at a TUNNEL:
    #     ssh -N -L 8081:127.0.0.1:8080 <user>@<big-box>        (keep it open)
    # Loopback on purpose, for two reasons: nothing is exposed on the LAN and no key
    # exists to leak, and CI's rule for a loopback provider (no key_env) then holds.
    # Run on the big box: scripts/qwen-local-fetch.sh, then scripts/qwen-local-serve.sh.
    #
    # THE MODEL ID BELONGS TO THIS GATEWAY. `qwen3.8-27b-q8` is the --alias that
    # scripts/qwen-local-serve.sh gives llama-server; it is not the Hugging Face id
    # (Qwen/Qwen3.8-27B) and not OpenRouter's (qwen/qwen3.8-27b), which is a different
    # provider entry above. Change one and the other must follow.
    #
    # FILES (ggml-org/Qwen3.8-27B-GGUF, headers read and sizes taken 2026-10-21):
    #   Qwen3.8-27B-Q8_0.gguf          28,595,763,648 B  qwen35, 64 blocks, 851 tensors
    #   mmproj-Qwen3.8-27B-Q8_0.gguf      629,247,008 B  vision encoder (qwen3vl_merger)
    #   mtp-Qwen3.8-27B-Q8_0.gguf       3,164,006,816 B  MTP head, a SEPARATE file
    #   dflash-Qwen3.8-27B-Q8_0.gguf    2,056,414,560 B  DFlash drafter, block size 8
    # The main file holds no MTP tensors (checked: zero `nextn` tensors), so the MTP head
    # is not optional decoration -- without the sidecar there is no MTP to switch on.
    # Speculative decoding is output-equivalent: the target verifies every token. MTP
    # and DFlash are alternatives; the serve script runs one at a time (default MTP).
    #
    # No key: a tunnel to a server you control authenticates nothing here.
    api: http://127.0.0.1:8081/v1
    api_key: "no-key-required"
    transport: chat_completions
    default_model: qwen3.8-27b-q8
    models:
      - qwen3.8-27b-q8
    discover_models: false
    # The serve script starts llama-server with the same -c. Only 16 of the 64 layers
    # use full attention, so the KV cache is small: 2 x 16 layers x 4 KV heads x 256 dim
    # x 2 bytes = 64 KiB per token, about 16 GiB at 262,144 tokens in f16 (arithmetic
    # from the GGUF header, not a measurement). Lower both together if the box is tight.
    context_length: 262144

  llamacpp-supervl-q8:
    name: "llama.cpp (Nemotron 3.5 Super VL 120B Q8_0, over an SSH tunnel)"
