    context_length: 131072

  llamacpp-ultra-q8:
    name: "llama.cpp (Nemotron 3 Ultra 550B UD-Q8_K_XL, over an SSH tunnel)"
    # MoA reference, opt-in through moa.presets.local-q8 (2026-10-21, on request). Not in the
