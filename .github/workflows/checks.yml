# Harness checks.
#
# This workflow gates what this repo ships: syntax on every script, the Hermes config's
# routing invariants (which fail silently on the desktop rather than erroring), the
# capability registry against disk, doc references, and legacy-name regressions.
#
# It deliberately does NOT gate on scripts/repo-doctor.sh. The doctor checks the
# MACHINE (toolchain, network egress, whether `hermes` is on PATH), and a CI runner is
# not the machine the build runs on. Run it locally.
#
name: checks

on:
  pull_request:
  push:
    branches: [The-MDC]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node ships on ubuntu-latest and these scripts are plain CommonJS with no
      # dependencies, so there is no setup-node step to get wrong.
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail

          # Enumerated by glob rather than by name so a script added later is covered
          # without anyone remembering to edit this file. The counts are asserted
          # below: a glob that silently matches nothing is a check that cannot fail.
          # RECURSIVE, not scripts/*.js — and that distinction already mattered once.
          # scripts/codex-mcp/server.js lives in a subdirectory, and a top-level glob
          # walks straight past it, so the MCP shim would have been the one script
          # here that nothing parsed. find also degrades correctly when a pattern
          # matches nothing, where an unmatched glob under `set -u` expands to itself
          # and `node --check 'scripts/*.js'` fails for a confusing reason.
          sh_count=0
          while IFS= read -r f; do
            echo "bash -n $f"; bash -n "$f"; sh_count=$((sh_count+1))
          done < <(find scripts -name '*.sh' | sort)
          js_count=0
          while IFS= read -r f; do
            echo "node --check $f"; node --check "$f"; js_count=$((js_count+1))
          done < <(find scripts -name '*.js' | sort)
          [ "$sh_count" -ge 2 ] || { echo "expected >=2 shell scripts, found $sh_count"; exit 1; }
          # The floor tracks the real count, or a legitimate change turns CI red for the
          # wrong reason. It went 2 -> 1 when check-canonical-numbers.js was removed and
          # port-skills-to-hermes.js was briefly the only *.js here, then back to 2 when
          # scripts/codex-mcp/server.js arrived. The guard's job is unchanged: fail a glob
          # that matches nothing.
          [ "$js_count" -ge 2 ] || { echo "expected >=2 node scripts, found $js_count"; exit 1; }

          # Python is checked too, because check-capabilities.py would otherwise be the only
          # script in scripts/ that nothing parses. It is Python rather than Node because the
          # registry is YAML and Node has no YAML parser without adding a dependency to a
          # repo that deliberately has none -- while CI already runs python3 with PyYAML for
          # the Hermes config block below.
          py_count=0
          while IFS= read -r f; do
            echo "python3 -m py_compile $f"; python3 -m py_compile "$f"; py_count=$((py_count+1))
          done < <(find scripts -name '*.py' | sort)
          [ "$py_count" -ge 1 ] || { echo "expected >=1 python script, found $py_count"; exit 1; }

      # The PowerShell scripts were unverified for three commits, because the
      # container they were written in has no pwsh and the Syntax step above only
      # globs *.sh and *.js. They are the scripts that install config onto a real
      # machine and the ones a takeover depends on, so "unchecked" was the wrong
      # place for them. ubuntu-latest ships pwsh, so this costs nothing.
      #
      # ParseFile against the real PowerShell AST parser, not a regex: it is the
      # same front end pwsh itself uses, so a file that passes here cannot fail to
      # parse on the Windows box. It does NOT prove the script behaves correctly --
      # only that it is syntactically whole.
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem scripts -Filter *.ps1 | Sort-Object Name
          if ($files.Count -lt 3) {
              Write-Error "expected >=3 PowerShell scripts, found $($files.Count)"
              exit 1
          }
          $bad = 0
          foreach ($f in $files) {
              $errors = $null; $tokens = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors -and $errors.Count) {
                  Write-Host "FAIL  $($f.Name): $($errors.Count) parse error(s)"
                  foreach ($e in $errors) {
                      Write-Host ("      line {0}: {1}" -f $e.Extent.StartLineNumber, $e.Message)
                  }
                  $bad++
              } else {
                  Write-Host "ok    $($f.Name) ($($tokens.Count) tokens)"
              }
          }
          if ($bad) { exit 1 }

      # The startup/update/model-change hardening is code that decides whether a changed
      # Hermes install is still routed where this repo says. A parse check proves it is
      # whole, not that it works, so the tests run it: the drift checker's 29 unit tests
      # (each one feeds it a deliberately broken config and requires a failure), and the
      # PowerShell glue -- launcher, autostart, update wrapper, profile apply, and the
      # drift section of hermes-verify -- against a fake `hermes` on PATH.
      #
      # The local Qwen3.8-27B (fallback 4) has the same shape of risk: scripts that
      # pull 34 GB and start a CUDA server cannot run in CI, so test_qwen_local.py runs
      # them against a fake curl and a fake llama-server, and requires the serve
      # script's alias and window to equal providers.llamacpp-qwen in the config.
      #
      # The three Q8+ servers (Super VL, Ultra, GLM; 1.07 TB of files) are the same shape of
      # risk and get the same treatment in test_q8_local.py: a fake curl and a fake
      # llama-server, and each model's alias, window and port compared with its provider.
      #
      # Windows-only calls (Register-ScheduledTask, the Startup folder, User-scope
      # environment variables) cannot run here and are NOT covered: on the box,
      # `hermes-dashboard-autostart.ps1 -Action Install -WhatIf` is that test.
      - name: Hardening tests (drift checker + PowerShell glue)
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml' || python3 -m pip install --quiet pyyaml
          python3 -I scripts/test_config_drift.py
          python3 -I scripts/test_qwen_local.py
          python3 -I scripts/test_q8_local.py
          pwsh -NoLogo -NoProfile -File scripts/test-hermes-ps.ps1

      # The Hermes config is data, not code: nothing in this repo executes it, so a
      # syntax error would surface only on the desktop that copies it into
      # ~/.hermes/config.yaml — where a malformed file makes Hermes fall back to its
      # defaults rather than erroring, and the carefully-chosen routing silently does
      # not apply. Parse it here instead.
      - name: Hermes config parses, and routes where it claims to
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, tomllib, yaml
          d = yaml.safe_load(open("configs/hermes/config.yaml"))

          providers = d["providers"]
          # Assert the key exists before indexing it. Renaming this provider is a
          # real deployment shape (an earlier deployment reported `nvidia`), and
          # indexing a missing key raises a bare KeyError that names no cause —
          # the one failure mode most likely to hit someone mid-reconciliation.
          assert "nvidia-nim" in providers, \
              "providers: must define 'nvidia-nim' — every custom:nvidia-nim reference " \
              "in this file resolves through that exact key, so renaming it dangles them all"
          assert providers["nvidia-nim"]["api"] == "https://integrate.api.nvidia.com/v1", \
              "the NIM provider must point at NVIDIA's endpoint"
          assert providers["nvidia-nim"]["key_env"] == "NVIDIA_API_KEY", \
              "the NIM key must come from the environment, never from this file"

          # Subagents must not reach the parent's endpoint, and must not be able to
          # fall back onto it. That separation is the whole point of the config; a
          # regression here quietly burns the parent's rate limit with no symptom.
          #
          # The invariant is "a different rate-limit bucket from the parent", and it
          # has now been narrowed wrongly TWICE, so it is worth stating plainly.
          # An early revision asserted 127.0.0.1, encoding a local llama-server
          # rather than the requirement. Its replacement asserted that subagents
          # avoid nvidia-nim, which encoded the topology where NIM was the PARENT's
          # bucket. Neither is the rule. When the parent moved to the HF router,
          # NIM became the children's own bucket and a fan-out there cannot starve
          # the parent -- so the NIM-specific clause was blocking a correct layout.
          #
          # Express the requirement itself and nothing narrower: a different
          # provider from the parent, and no chain back to it.
          #
          # AMENDED 2026-10-19, on request ("the nemotron 3.5 Super VL should be the
          # only gateway and inference"): the parent is now nvidia-nim, and so are
          # subagents, the MoA reference and vision. Separate buckets are traded away
          # on purpose, so "different provider from the parent" can no longer be the
          # rule. What replaces it is narrower and still fails loudly: a slot MAY share
          # the parent's provider only if it uses the parent's EXACT model. That
          # blocks the real regression -- a second, stray model id (a nano, an old
          # 49B, a typo) quietly spending the primary's RPM bucket -- without
          # hardcoding any model id here, so a future primary swap does not leave
          # this assertion guarding a retired name.
          deleg = d["delegation"]
          parent_provider = d["model"]["provider"]
          parent_default = d["model"]["default"]
          assert deleg.get("provider"), "subagents must name a provider"
          if deleg["provider"] == parent_provider:
              assert deleg.get("model") == parent_default, \
                  f"subagents share the parent's provider ({parent_provider}) but run " \
                  f"{deleg.get('model')!r}, not the parent's {parent_default!r} -- a " \
                  f"second model on the primary's bucket is how its RPM gets spent unseen"
          assert deleg["fallback_providers"] == [], \
              "subagents must have no fallback chain back onto the parent"

          # Every REMOTE provider authenticates from the environment. One inline key
          # here would be committed, and the repo's own rule is that secrets never are.
          #
          # Loopback is exempt, and the exemption is narrow on purpose: a server on
          # your own machine authenticates nothing, so its "key" is a placeholder, not
          # a secret. The exemption is keyed on the host actually resolving to
          # loopback — not on the provider being *named* "local", which anyone could
          # do to a remote endpoint and slip a real key past this check.
          from urllib.parse import urlparse
          LOOPBACK = {"127.0.0.1", "localhost", "::1", "[::1]"}
          def is_loopback(url):
              return (urlparse(url).hostname or "") in LOOPBACK

          for name, prov in providers.items():
              if is_loopback(prov["api"]):
                  assert "key_env" not in prov, \
                      f"{name} is loopback and needs no key_env"
                  continue
              assert "key_env" in prov, f"{name} must authenticate via key_env"
              assert "api_key" not in prov, f"{name} must not carry an inline key"

          # Distinct hosts, or the isolation the whole config exists for is lost.
          hosts = {urlparse(p_["api"]).netloc for p_ in providers.values()}
          assert len(hosts) == len(providers), f"providers share a host: {hosts}"

          # The picker must stay pinned. `discover_models` defaults to TRUE, and a
          # `models:` list alone does not whitelist — Hermes reads that as context-length
          # overrides and still probes /models. Drop this flag and the HF router and
          # OpenRouter each pour hundreds of entries back into the picker.
          for name, prov in providers.items():
              assert prov.get("discover_models") is False, \
                  f"{name} must set discover_models: false or the picker unpins"
              assert prov.get("models"), f"{name} must list its models explicitly"

          # excluded_providers matches case-insensitively against every key a provider
          # surfaces under, so a provider here NAMED like a built-in would hide itself.
          # That is why the OpenRouter entry is called or-fallback.
          excluded = {e.lower() for e in d.get("excluded_providers", [])}
          clash = excluded & {n.lower() for n in providers}
          assert not clash, f"provider name collides with its own exclusion: {clash}"

          # Codex is a DELEGATE (subprocess, via the bundled `codex` skill), never a
          # 5th inference provider. Hermes' own `openai-codex` provider and the Codex
          # CLI read separate token files against the SAME ChatGPT 5-hour usage
          # window; turning the provider on makes that window's spend invisible to
          # itself. See docs/models/codex-handoff.md.
          assert "openai-codex" in excluded, \
              "openai-codex must stay in excluded_providers — Codex is delegated to, " \
              "never wired as a model provider (docs/models/codex-handoff.md)"

          # The research browser must not silently bill an API. Hermes' auto-detection
          # prefers Firecrawl over SearXNG whenever FIRECRAWL_API_KEY is merely present
          # in the environment, so the search backend has to be named explicitly.
          web = d.get("web", {})
          assert web.get("search_backend") == "searxng", \
              "web.search_backend must name searxng explicitly, not rely on auto-detect"

          # Match the key SHAPE, not the bare prefix. The config names the prefix in a
          # comment on purpose, to show where the key goes; matching that would fail
          # every run and teach people to ignore the check.
          raw = open("configs/hermes/config.yaml").read()
          leaked = re.findall(r"nvapi-[A-Za-z0-9_-]{20,}", raw)
          assert not leaked, "config.yaml contains something shaped like a live NVIDIA key"

          # MCP servers reach the model on EVERY request: each one's tools are
          # injected into the system prompt. Two invariants, both about throughput
          # as much as trust.
          #
          # 1. Loopback or local subprocess, UNLESS the server is on the hosted
          #    allowlist below. `hermes import-agent claude-code` migrates
          #    .mcp.json wholesale, which would drag seven hosted company MCPs
          #    (supabase, github, alchemy, figma, gmail, drive, netlify) into a
          #    personal agent build. Each is a round trip and a block of prompt.
          #
          #    The allowlist is how a hosted server gets in ON PURPOSE rather than
          #    by drift: adding one is a visible edit to this file, reviewed, not a
          #    line that slipped into a config nobody re-reads. Keep it short. Every
          #    name here costs a round trip per call and prompt space on every
          #    request, against every bucket at once.
          # 2. Every server names its tools. An unfiltered server injects its whole
          #    catalogue forever; on a 40 RPM tier that is a permanent tax.
          HOSTED_MCP_ALLOWED = {"cloudflare", "submcp"}
          mcp = d.get("mcp_servers", {}) or {}
          for name, srv in mcp.items():
              if "url" in srv:
                  host = urlparse(srv["url"]).hostname or ""
                  assert host in LOOPBACK or name in HOSTED_MCP_ALLOWED, \
                      f"mcp_servers.{name} points off-box at {host} and is not in " \
                      f"HOSTED_MCP_ALLOWED — add it there deliberately, with a reason, " \
                      f"or keep it in Claude Code's .mcp.json instead"
              else:
                  assert srv.get("command"), \
                      f"mcp_servers.{name} has neither a loopback url nor a command"
              tools = srv.get("tools") or {}
              assert tools.get("include") or tools.get("unfiltered") is True, \
                  f"mcp_servers.{name} must either name its tools via tools.include or " \
                  f"declare tools.unfiltered: true — silence is how a server's whole " \
                  f"catalogue ends up in every request unnoticed"

          # Auxiliary slots default to `auto`, and `auto` means "use the main model".
          # Left alone, a 2.8T always-thinking model writes your session titles and
          # spends the same 40 RPM bucket as the conversation. The point of the block
          # is that these do NOT resolve to the parent provider.
          aux = d.get("auxiliary", {}) or {}
          assert aux, "auxiliary: is missing — every side-job would run on the main model"
          for task, cfg in aux.items():
              prov = cfg.get("provider", "auto")
              assert prov != "auto", \
                  f"auxiliary.{task} is on auto, which routes it to the main model and the parent bucket"
              # `custom:local` is exempt from the bucket-collision rule below. That
              # rule protects a metered, RPM-limited CLOUD bucket from a side job
              # stealing the parent's quota, and Ollama has no RPM quota to steal.
              # Sharing `custom:local` with the parent is a DIFFERENT, real cost --
              # VRAM/compute contention between whatever's resident there (as of
              # 2026-09-28, a 49B parent alongside the 3B floor auxiliary slots) --
              # just not the failure this specific assertion exists to catch, and
              # not a reason to weaken it for every other provider too.
              if prov != "custom:local":
                  if prov == parent_provider:
                      # AMENDED 2026-10-19 with the single-primary layout: ONE slot
                      # may ride the parent's provider -- `vision`, because the
                      # primary is a vision-language model and an image-only second
                      # model is exactly what was retired -- and only on the
                      # parent's exact model. Every other slot (title, approval,
                      # compression, ...) is a frequent side job; each one on this
                      # provider is a request taken from the parent's RPM bucket.
                      assert task == "vision", \
                          f"auxiliary.{task} points at the parent provider ({prov}) — only " \
                          f"`vision` may share it; any other slot defeats the split"
                      assert cfg.get("model") == parent_default, \
                          f"auxiliary.{task} shares the parent provider but runs " \
                          f"{cfg.get('model')!r}, not the parent's {parent_default!r}"
              assert cfg.get("model"), f"auxiliary.{task} names a provider but no model"

          # A fallback can only answer a 429 on the parent if it does not share the
          # parent's endpoint. With the parent on a cloud bucket this is the check
          # that matters: a 429 on nvidia-nim cannot be answered from nvidia-nim, and
          # the old chain led with exactly that. So the FIRST link must be off the
          # parent's endpoint.
          #
          # One sanctioned shape for a LATER link: back on the parent's endpoint, on a
          # DIFFERENT model that the provider lists (nvidia/nemotron-3.5-lightning-30b-a3b on NIM,
          # 2026-10-19, on request). It spends the same bucket, so it cannot answer a
          # 429; it can answer a failure of the parent MODEL (retired id, a 5xx).
          # Listed-under-models is required for the same reason as the aggregator:
          # discover_models:false turns an unlisted id into a silent fallback to the
          # main model, not an error.
          parent_name = parent_provider.split(":", 1)[1] if parent_provider.startswith("custom:") else parent_provider
          parent_host = urlparse(providers[parent_name]["api"]).netloc if parent_name in providers else None
          parent_listed = set(providers[parent_name].get("models") or []) if parent_name in providers else set()
          fallbacks = d.get("fallback_providers") or []
          assert fallbacks, "fallback_providers: is empty — a 429 on the parent would stop the session"
          for i, fb in enumerate(fallbacks):
              fb_host = urlparse(fb.get("base_url", "")).netloc
              if parent_host and fb_host == parent_host:
                  assert i > 0, \
                      f"fallback_providers[0] ({fb.get('model')}) is on the parent's endpoint " \
                      f"({parent_host}) — the first link is the 429 escape and must sit on a different bucket"
                  assert fb.get("model") != d["model"]["default"], \
                      f"fallback_providers[{i}] is the parent's own model on the parent's endpoint — " \
                      f"it can answer nothing the parent could not"
                  assert fb.get("model") in parent_listed, \
                      f"fallback_providers[{i}] ({fb.get('model')}) is on the parent's endpoint but is not " \
                      f"listed under providers.{parent_name}.models — an unlisted id resolves silently to the main model"

          # AMENDED 2026-10-20: the rule above covered only links back on the PARENT's
          # endpoint. GLM-5.3 Flash is now fallback 1 on OpenRouter, so the same silent
          # failure (an unlisted id resolving to the main model) applies to every
          # fallback that sits on ANY configured provider's host, not just NIM's.
          host_models = {urlparse(p_["api"]).netloc: (n_, set(p_.get("models") or []))
                         for n_, p_ in providers.items()}
          for i, fb in enumerate(fallbacks):
              hit = host_models.get(urlparse(fb.get("base_url", "")).netloc)
              if hit:
                  assert fb.get("model") in hit[1], \
                      f"fallback_providers[{i}] ({fb.get('model')}) is on providers.{hit[0]}'s " \
                      f"endpoint but is not listed under providers.{hit[0]}.models -- an unlisted " \
                      f"id resolves silently to the main model"

          # Every provider REFERENCE must resolve to something that can actually
          # serve. The exclusion check above compares excluded_providers against the
          # `providers:` dict only — it never looks at what the REST of the file
          # points at, and both ways a reference dies are silent: Hermes resolves a
          # dead one by falling back to the main model, so the symptom is a bill and
          # a latency change, not an error. Both were observed on a live deployment,
          # recorded in docs/models/HANDOFF-NEXT-SESSION.md.
          #
          #   1. The reference names a provider that is also EXCLUDED. The exclusion
          #      hides it, so the slot silently reverts to the parent. A config with
          #      moa.aggregator on `anthropic` while `anthropic` sits in the
          #      exclusion list is the case this catches.
          #   2. `custom:X` names an X that is not in `providers:` at all, after a
          #      rename (nvidia-nim -> nvidia) or a deletion. Every reference to the
          #      old name dangles, and the slots quietly rejoin the parent bucket.
          def provider_refs():
              yield "model.provider", parent_provider
              yield "delegation.provider", deleg["provider"]
              for task_, cfg_ in aux.items():
                  yield f"auxiliary.{task_}.provider", cfg_.get("provider")
              moa_ = d.get("moa") or {}
              for i, ref_ in enumerate(moa_.get("reference_models") or []):
                  yield f"moa.reference_models[{i}].provider", (ref_ or {}).get("provider")
              if moa_.get("aggregator"):
                  yield "moa.aggregator.provider", moa_["aggregator"].get("provider")
              for pn_, pr_ in (moa_.get("presets") or {}).items():
                  for i, ref_ in enumerate((pr_ or {}).get("reference_models") or []):
                      yield f"moa.presets.{pn_}.reference_models[{i}].provider", (ref_ or {}).get("provider")
                  if (pr_ or {}).get("aggregator"):
                      yield f"moa.presets.{pn_}.aggregator.provider", pr_["aggregator"].get("provider")

          for where, ref in provider_refs():
              if not ref or ref == "auto":
                  continue
              custom = ref.startswith("custom:")
              bare = ref.split(":", 1)[1] if custom else ref
              assert bare.lower() not in excluded, \
                  f"{where} names '{bare}', which is in excluded_providers — the " \
                  f"exclusion hides it and the slot falls back to the main model"
              if custom:
                  assert bare in providers, \
                      f"{where} points at custom provider '{bare}', which is not " \
                      f"defined in providers: — a rename or deletion left it dangling"

          # The throughput block. These are deliberate, counter-intuitive choices;
          # a well-meaning edit back to the defaults would quietly undo them.
          ce = d.get("code_execution", {})
          assert ce.get("mode") in ("project", "strict"), \
              "code_execution.mode must be set — it collapses multi-call pipelines into one request"

          # The PARENT model must have a raised compaction threshold, whatever the
          # parent currently is. This used to hardcode `kimi-k3`, which stopped
          # guarding anything the moment the parent changed: the key stayed, the
          # assertion kept passing, and it referred to a model no longer in use.
          # Resolve the key against the configured parent instead, by substring,
          # the same way Hermes resolves it.
          comp = d.get("compression", {})
          parent_model = d["model"]["default"]
          thresholds = comp.get("model_thresholds") or {}
          matched = {k: v for k, v in thresholds.items()
                     if k.lower() in parent_model.lower()}
          assert matched, \
              f"compression.model_thresholds has no key matching the parent model " \
              f"({parent_model}) -- Hermes matches these by substring, so a stale key " \
              f"guards nothing and the parent compacts at the global default unnoticed"
          parent_threshold = matched[max(matched, key=len)]  # longest key wins
          assert parent_threshold > comp.get("threshold", 0.50), \
              "the parent's compression threshold must be RAISED above the global " \
              "default: each compaction is itself a request AND it invalidates the " \
              "provider prompt cache, so the next request re-reads all of it at full price"
          assert parent_threshold <= 0.80, \
              "a parent threshold above 0.80 risks provider-proven overflow, which costs " \
              "a rejected request plus recovery -- worse than the compaction it avoids"

          # MIXTURE OF AGENTS. On a MoA turn the AGGREGATOR is the ACTING model: it
          # writes the reply and runs every tool-loop iteration (hermes-agent docs,
          # "Mixture of Agents", read 2026-10-19). Four things go wrong here without
          # an error, and each one is asserted below:
          #   1. The two config shapes -- flat moa.aggregator and
          #      moa.presets.<default_preset>.aggregator -- drift apart, and the one
          #      the installed Hermes does NOT read is the one a person edits. This
          #      file's preset once carried no aggregator at all.
          #   2. The aggregator is the same provider+model as a reference, so MoA
          #      checks its own work and nothing else. (The old rule here was
          #      "different PROVIDER"; both roles now share NIM on request, so the
          #      rule that can still hold is "different MODEL".)
          #   3. The aggregator id is not in its provider's models: list. With
          #      discover_models:false a wrong id does not error -- it resolves to
          #      the main model, so MoA would quietly aggregate with the parent.
          #   4. The aggregator, being the acting model, has no raised compaction
          #      threshold, so it compacts at the global default.
          moa = d.get("moa") or {}
          moa_preset_name = moa.get("default_preset", "default")
          moa_preset = (moa.get("presets") or {}).get(moa_preset_name)
          assert moa_preset, \
              f"moa.default_preset names '{moa_preset_name}', which is not under moa.presets"
          flat_agg = moa.get("aggregator") or {}
          preset_agg = moa_preset.get("aggregator") or {}
          assert flat_agg.get("model") and preset_agg.get("model"), \
              f"moa needs an aggregator in BOTH shapes: moa.aggregator and " \
              f"moa.presets.{moa_preset_name}.aggregator (a preset without one has no acting model)"
          pm = lambda s: (s.get("provider"), s.get("model"))
          assert pm(flat_agg) == pm(preset_agg), \
              f"moa.aggregator {pm(flat_agg)} and moa.presets.{moa_preset_name}.aggregator " \
              f"{pm(preset_agg)} disagree -- whichever shape Hermes does not read is stale"
          flat_refs = [pm(r) for r in (moa.get("reference_models") or [])]
          preset_refs = [pm(r) for r in (moa_preset.get("reference_models") or [])]
          assert flat_refs and flat_refs == preset_refs, \
              f"moa.reference_models {flat_refs} and moa.presets.{moa_preset_name}." \
              f"reference_models {preset_refs} disagree (or are empty)"
          assert pm(preset_agg) not in preset_refs, \
              f"moa aggregator {pm(preset_agg)} is also a reference -- MoA would check " \
              f"its own work; the aggregator must be a different model"
          # AMENDED 2026-10-20, with the five-reference roster (two on OpenRouter, three
          # on NIM). Each reference is a model the user chose by name, and a wrong id
          # fails the same silent way the aggregator's does: discover_models:false means
          # it resolves to the main model, so that adviser would quietly be Super VL
          # again. Every reference must be listed under its own provider's models:.
          # A repeated (provider, model) pair is one adviser counted twice.
          assert len(set(preset_refs)) == len(preset_refs), \
              f"moa references repeat a (provider, model) pair: {preset_refs}"
          for ref_provider, ref_model in preset_refs:
              if (ref_provider or "").startswith("custom:"):
                  ref_name = ref_provider.split(":", 1)[1]
                  ref_listed = (providers.get(ref_name) or {}).get("models") or []
                  assert ref_model in ref_listed, \
                      f"moa reference {ref_model!r} is not in providers.{ref_name}.models " \
                      f"-- discover_models:false means a wrong id silently resolves to the main model"
          agg_provider, agg_model = preset_agg["provider"], preset_agg["model"]
          if agg_provider.startswith("custom:"):
              agg_listed = (providers.get(agg_provider.split(":", 1)[1]) or {}).get("models") or []
              assert agg_model in agg_listed, \
                  f"moa aggregator {agg_model!r} is not in providers.{agg_provider.split(':', 1)[1]}.models " \
                  f"-- discover_models:false means a wrong id silently resolves to the main model"
          agg_matched = {k: v for k, v in thresholds.items() if k.lower() in agg_model.lower()}
          assert agg_matched, \
              f"compression.model_thresholds has no key matching the MoA aggregator " \
              f"({agg_model}) -- it is the ACTING model on a MoA turn and would compact " \
              f"at the global default"
          agg_threshold = agg_matched[max(agg_matched, key=len)]
          assert comp.get("threshold", 0.50) < agg_threshold <= 0.80, \
              f"the MoA aggregator's compaction threshold ({agg_threshold}) must sit above the " \
              f"global default and at or below 0.80, for the same reasons as the parent's"

          # EVERY PRESET, not only the default one (added 2026-10-21 with the opt-in local-q8
          # preset). Everything above guards moa.presets.<default_preset>; a second preset
          # that nobody selects yet was checked by nothing, so a typo'd id or an aggregator
          # that is also a reference would first show up the day someone switched to it. The
          # rules are the default preset's: an aggregator, no repeats, the aggregator is not
          # a reference, and every id is listed under a provider that exists.
          for pname, pre in (moa.get("presets") or {}).items():
              if pname == moa_preset_name:
                  continue
              pagg = pre.get("aggregator") or {}
              assert pagg.get("model"), \
                  f"moa.presets.{pname} has no aggregator -- a preset without one has no acting model"
              prefs = [pm(r) for r in (pre.get("reference_models") or [])]
              assert prefs, f"moa.presets.{pname} has no reference_models"
              assert len(set(prefs)) == len(prefs), \
                  f"moa.presets.{pname} references repeat a (provider, model) pair: {prefs}"
              assert pm(pagg) not in prefs, \
                  f"moa.presets.{pname}: aggregator {pm(pagg)} is also a reference"
              for who, (pv, mid) in [("aggregator", pm(pagg))] + [("reference", r_) for r_ in prefs]:
                  if (pv or "").startswith("custom:"):
                      pn = pv.split(":", 1)[1]
                      assert pn in providers, \
                          f"moa.presets.{pname} {who} names provider {pv!r}, which is not defined in providers:"
                      assert mid in (providers[pn].get("models") or []), \
                          f"moa.presets.{pname} {who} {mid!r} is not in providers.{pn}.models " \
                          f"-- discover_models:false means a wrong id silently resolves to the main model"
              pagg_matched = {k: v for k, v in thresholds.items() if k.lower() in pagg["model"].lower()}
              assert pagg_matched, \
                  f"moa.presets.{pname}: no compression.model_thresholds key matches the aggregator " \
                  f"({pagg['model']}) -- it is the acting model on that preset's turns"

          # THE CODER PRESET (added 2026-10-21, on request). z-ai/glm-5.3 on NIM is the acting
          # model of the opt-in moa.presets.coder preset and of nothing else, and Nemotron 3
          # Ultra is its only reference. Four things go wrong here without an error:
          #   1. GLM-5.3 leaks into a slot that should stay on the parent's model (delegation,
          #      an auxiliary, a fallback, the default MoA preset) and spends the shared ~40 RPM
          #      bucket on a model nobody chose for that role.
          #   2. The coder preset quietly becomes the default, so every turn runs on GLM.
          #   3. The reviewer drifts from the top Nemotron (Ultra) to something else.
          #   4. GLM-5.3 is routed but is not listed under providers.nvidia-nim.models.
          coder = (moa.get("presets") or {}).get("coder")
          if coder:
              CODER = ("custom:nvidia-nim", "z-ai/glm-5.3")
              ULTRA = ("custom:nvidia-nim", "nvidia/nemotron-3-ultra-550b-a55b")
              assert pm(coder.get("aggregator") or {}) == CODER, \
                  f"moa.presets.coder aggregator is {pm(coder.get('aggregator') or {})}, expected {CODER}"
              assert [pm(r) for r in coder.get("reference_models") or []] == [ULTRA], \
                  "moa.presets.coder must have Nemotron 3 Ultra as its only reference"
              assert "z-ai/glm-5.3" in (providers["nvidia-nim"].get("models") or []), \
                  "z-ai/glm-5.3 is routed by moa.presets.coder but not listed under providers.nvidia-nim.models"
              assert moa_preset_name != "coder", \
                  "moa.default_preset is coder: the opt-in coder preset must not be the default"
              assert pm(flat_agg) != CODER, \
                  "the flat moa.aggregator is the coder model: GLM-5.3 must stay opt-in"
              rest = {k: v for k, v in d.items() if k not in ("providers", "moa")}
              assert "z-ai/glm-5.3" not in json.dumps(rest).replace("z-ai/glm-5.3-flash", ""), \
                  "z-ai/glm-5.3 appears outside providers: and moa:. It is the coder preset's model only"
              for pname, pre in (moa.get("presets") or {}).items():
                  if pname == "coder":
                      continue
                  used = [pm(pre.get("aggregator") or {})] + [pm(r) for r in pre.get("reference_models") or []]
                  assert CODER not in used, f"moa.presets.{pname} routes z-ai/glm-5.3; only the coder preset may"

          # Rotating a credential pool discards the provider-side prompt cache, and
          # Kimi-K3 carries a large always-thinking prefix. round_robin would pay
          # that on every selection.
          pools = d.get("credential_pool_strategies", {})
          for pname, strat in pools.items():
              assert strat == "fill_first", \
                  f"credential_pool_strategies.{pname} is {strat}: only fill_first preserves " \
                  f"the prompt cache between rotations"

          # If the Codex CLI config template exists, it must not quietly open a
          # second, custom inference route — that is the same mistake as wiring
          # openai-codex above, one file over. Optional: this repo works without
          # ever having adopted Codex at all.
          codex_toml = "configs/codex/config.toml"
          codex_forbidden = set()
          if os.path.exists(codex_toml):
              with open(codex_toml, "rb") as f:
                  codex_cfg = tomllib.load(f)
              codex_forbidden = {"model_provider", "model_providers", "openai_base_url",
                                  "chatgpt_base_url"} & set(codex_cfg)
              assert not codex_forbidden, \
                  f"{codex_toml} sets {codex_forbidden} — Codex must keep its own " \
                  f"default OpenAI routing, never a silent custom provider " \
                  f"(docs/models/codex-handoff.md)"

          # ---- Super VL compensations (2026-10-19) -------------------------------
          # Super VL is a 12B-active model on a 131k window and one ~40 RPM bucket, so
          # per-request prompt weight is a cost every turn. Three things keep it down,
          # and each one fails SILENTLY if it drifts: nothing errors, the prompt just
          # grows.
          #
          # 1. Every MCP server switches off its utility tools. Hermes registers four per
          #    server (list/read resources, list/get prompts) unless told not to.
          for name, srv in mcp.items():
              t = srv.get("tools") or {}
              assert t.get("prompts") is False and t.get("resources") is False, \
                  f"mcp_servers.{name}.tools must set prompts: false and resources: false " \
                  f"(four unused catalog entries per server otherwise)"
          # 2. tool_search stays pinned on, with its listing. Off, every MCP schema goes
          #    back into every request. A bare bridge (listing off) leaves the model
          #    unable to see tool names at all.
          ts = (d.get("tools") or {}).get("tool_search") or {}
          assert ts.get("enabled") in ("on", "auto"), \
              f"tools.tool_search.enabled must be 'on' or 'auto' (quoted), got {ts.get('enabled')!r}"
          assert ts.get("listing", "auto") in ("on", "auto"), \
              f"tools.tool_search.listing must be 'on' or 'auto', got {ts.get('listing')!r}"
          # 3. Hermes loads ONE project context file and prefers .hermes.md over CLAUDE.md.
          #    The short one has to exist, stay short, carry no Claude-Code-only
          #    vocabulary, and name the models the config actually routes to. Reading the
          #    ids out of the config keeps this check from holding its own copy.
          assert os.path.exists(".hermes.md"), \
              ".hermes.md is missing: Hermes would load the long, Claude-Code-oriented CLAUDE.md"
          hm = open(".hermes.md", encoding="utf-8").read()
          assert len(hm.encode()) <= 3000, \
              f".hermes.md is {len(hm.encode())} bytes; the cap is 3000. It is paid on every request"
          for banned in ("AskUserQuestion", "TodoWrite", ".claude/", "Claude Code", "security-review"):
              assert banned not in hm, f".hermes.md mentions {banned!r}, which Hermes cannot act on"
          for needed in (d["model"]["default"], agg_model):
              assert needed in hm, \
                  f".hermes.md does not name {needed}; it has drifted from config.yaml"

          print("hermes config: OK")
          print("  primary   ", d["model"]["provider"], d["model"]["default"])
          print("  subagents ", deleg["provider"], deleg["model"])
          print("  moa       ", "refs", [m for _, m in preset_refs], "-> aggregator",
                preset_agg["provider"], agg_model, "| compress@" + str(agg_threshold))
          print("  buckets   ", ", ".join(sorted(hosts)))
          print("  web       ", web.get("search_backend"), "+", web.get("extract_backend"))
          hosted_used = sorted(n for n in mcp if n in HOSTED_MCP_ALLOWED)
          print("  mcp       ", len(mcp), "server(s),",
                (f"{len(hosted_used)} hosted ({', '.join(hosted_used)})"
                 if hosted_used else "all loopback/local") + ", all tool-filtered")
          shares = sorted(t for t, c in aux.items() if c.get("provider") == parent_provider)
          print("  auxiliary ", len(aux), "slot(s);", (", ".join(shares) or "none"),
                "shares the primary, the rest off its bucket ->",
                sorted({c["provider"] for c in aux.values()}))
          print("  throughput", "execute_code:" + str(ce.get("mode")),
                "| parent compress@" + str(parent_threshold),
                "| pools:" + ",".join(sorted(pools)))
          print("  picker    ", len([m for p_ in providers.values() for m in p_["models"]]),
                "models, pinned;", len(excluded), "built-ins excluded")
          print("  codex     ", "openai-codex excluded as a provider; delegated via "
                "subprocess" + (" | configs/codex/config.toml: no custom route"
                if os.path.exists(codex_toml) else " | configs/codex/config.toml: absent"))
          PY

      # Capabilities were DUPLICATED across two surfaces rather than shared, and the
      # duplicates diverged with nothing reporting it: 78 skills under .claude/skills/,
      # 31 under hermes-skills/, nine names in common. Two skills written so the local
      # tier could take the handoff landed on one surface only and were invisible to the
      # other.
      #
      # capabilities.yaml declares what exists and which surfaces carry it. This step is
      # what makes that declaration binding rather than decorative. It is NOT a parity
      # check -- asymmetry is often correct, and hosted MCP servers are kept out of
      # Hermes on purpose because every tool costs prompt space on every request. It
      # requires that asymmetry be DECLARED, with a reason.
      #
      # It also validates skill frontmatter, which nothing did before. That is not
      # theoretical: four skills shipped unreachable, three of them since removed,
      # because a skill with a missing metadata block loads fine and simply never fires.
      - name: Capabilities match capabilities.yaml
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-capabilities.py

      # cmd.exe closes a parenthesised block at the first bare ")" -- echo text
      # included. codex-mcp-launch.cmd printed `.Source was unexpected at this time.`
      # instead of its own error because of one. The negative case proves the check
      # can fail: a file with the original bug must exit 1.
      - name: cmd launchers have no unescaped parenthesis in a block
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/check-cmd-parens.py scripts/*.cmd
          bad="$(mktemp)"
          printf '%s\n' 'if defined X (' '    set "A=1"' ') else (' "    echo (Get-Command node).Source" '    exit /b 9' ')' > "$bad"
          if python3 -I scripts/check-cmd-parens.py "$bad"; then
            echo "check-cmd-parens passed a known-bad file"; exit 1
          fi

      # gateway-doctor.js is only a check if it can fail. This builds one home that
      # must pass and two that must fail (a sticky named profile; the 43-byte text a
      # Windows git checkout leaves where a symlink was) and asserts all three exit
      # codes. Drop either detector and the matching case turns this step red.
      - name: Gateway doctor passes a clean home and fails both known faults
        shell: bash
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          mkdir -p "$T/good/plugins/p/desktop" "$T/sticky" "$T/stub/plugins/p/desktop"
          echo default > "$T/good/active_profile"
          printf 'export default {}\n' > "$T/good/plugins/p/desktop/plugin.js"
          echo seven6moa > "$T/sticky/active_profile"
          printf '../pkg/desktop/plugin.js' > "$T/stub/plugins/p/desktop/plugin.js"
          node scripts/gateway-doctor.js --home "$T/good" --no-cli
          for bad in sticky stub; do
            if node scripts/gateway-doctor.js --home "$T/$bad" --no-cli; then
              echo "gateway-doctor passed the '$bad' fixture, which must fail"; exit 1
            fi
          done
          echo "gateway-doctor: OK"

      # A doc reference that points at a file which does not exist is the same class
      # of silent failure as a hook pointing at a missing script: nothing errors, the
      # reader just follows a dead pointer. One shipped in this PR before this gate
      # existed — the preflight told people to read local-flash-model.md, which was
      # never the filename.
      - name: Doc references resolve
        shell: bash
        run: |
          set -euo pipefail
          dead=0; checked=0
          while IFS= read -r ref; do
            checked=$((checked+1))
            [ -f "$ref" ] || { echo "DEAD: $ref"; dead=$((dead+1)); }
          done < <(grep -rhoE 'docs/[a-zA-Z0-9/_-]+\.md' docs scripts configs .github 2>/dev/null | sort -u)
          echo "checked $checked doc reference(s)"
          [ "$checked" -gt 0 ] || { echo "found none — the grep is broken"; exit 1; }
          [ "$dead" -eq 0 ] || exit 1

      # A gate used to live here comparing product figures across the tree, together
      # with scripts/check-canonical-numbers.js and an assertion that the checker had
      # not silently examined nothing. It went when the product content went: this
      # repo is the Hermes + Codex orchestration build and states no such figures, so
      # the gate now has nothing to compare and could only ever pass vacuously.
      #
      # Recorded rather than deleted quietly, because it cost something worth knowing:
      # the gate walked the WHOLE repo on every PR, so a change that merely reworded a
      # sentence near a number failed CI for a reason unrelated to the diff — and a
      # check that fires on unrelated work gets routed around rather than read. A
      # future session adding a repo-wide content gate should scope it to the files
      # that can actually carry the thing being checked. The port script's own scrub
      # assertion is scoped that way: it reads only the tree it just wrote.

      # The build's display name is "Seven6-MOA [Nemo-Hermes]". Earlier names kept
      # reappearing in prose, so this fails when one comes back. Case-sensitive on
      # purpose: the lowercase repo slug (seven6-hermes-moa) and the Hermes profile id
      # (seven6moa) are machine identifiers that must stay. This file is excluded
      # because it has to spell the patterns.
      - name: No legacy names
        shell: bash
        run: |
          set -euo pipefail
          for f in README.md CLAUDE.md .hermes.md; do
            grep -q 'Seven6-MOA \[Nemo-Hermes\]' "$f" || { echo "MISSING display name in $f"; exit 1; }
          done
          hits=$(git ls-files -z | grep -zv '^\.github/workflows/checks\.yml$' \
            | xargs -0 grep -nIE 'Seven6-Hermes-MOA|Hermes-MOA-Build|Hermes-MOA-B|Seven6MOA|hermes-codex-build|Hermes-MOA-Nemotron|hermes-moa-build|moa-b/' || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "legacy name(s) found"; exit 1; fi
          # Gateways and models that were removed from this build. `deepseek` itself stays
          # legitimate: it is an excluded provider key in config.yaml, not a route.
          gone=$(git ls-files -z | grep -zv '^\.github/workflows/checks\.yml$' \
            | xargs -0 grep -nIiE 'hf-router|local-vl|hermes3:8b|kimi-k3|deepseek-v4' || true)
          if [ -n "$gone" ]; then echo "$gone"; echo "removed gateway/model name(s) found"; exit 1; fi
          echo "no legacy names"
