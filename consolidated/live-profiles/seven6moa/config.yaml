# Hermes Agent -- Seven6-MOA [Nemo-Hermes]. One primary model, NVIDIA Nemotron 3.5 Super VL
# on NVIDIA NIM, serves every role that routes inference; OpenRouter and local
# Ollama are failover, and Anthropic-direct is kept configured but unrouted.
#
# Copy to ~/.hermes/config.yaml (back up whatever is there first), then run
#     scripts/nim-preflight.sh
# before you trust it. The preflight proves the key works, proves traffic lands on
# NVIDIA and not somewhere else, and reports what the endpoint actually supports.
#
# NO KEY GOES IN THIS FILE. Every remote provider reads `key_env`. Put them in
# ~/.hermes/.env (chmod 600) or export them:
#     NVIDIA_API_KEY=nvapi-...      https://build.nvidia.com  -> "Get API Key"
#     OPENROUTER_API_KEY=sk-or-v1-...   https://openrouter.ai/keys
#     ANTHROPIC_API_KEY=sk-ant-...  https://console.anthropic.com/settings/keys
#       Optional. Enables `anthropic-direct` (see providers: below), which is NOT
#       wired into any tier by default -- absence changes nothing else. USE A KEY
#       DEDICATED TO THIS PROVIDER, distinct from whatever authenticates Claude
#       Code or any other Anthropic surface on this machine: two consumers on one
#       account is invisible to both of them until a bill or a rate limit says
#       otherwise, which is the exact failure `openai-codex` is excluded below to
#       prevent for ChatGPT. Same shape, different vendor.
# The local tier needs no key at all — it is a server on your own machine.
#
# ---------------------------------------------------------------------------
# THE SHAPE
#
# Current state and open items: docs/models/HANDOFF-NEXT-SESSION.md. This file is the
# reconciled target, not a record of what any deployment drifted into.
#
#   parent      NVIDIA NIM     nemotron-3.5-super-vl-120b-a12b  -- THE primary model,
#                              2026-10-19, on request ("the nemotron 3.5 Super VL
#                              should be the only gateway and inference")
#   subagents   NVIDIA NIM     nemotron-3.5-super-vl-120b-a12b  same model, same bucket
#   vision      NVIDIA NIM     nemotron-3.5-super-vl-120b-a12b  it is a VL model;
#                              pinned, never `auto` -- see auxiliary.vision
#   moa ref     NVIDIA NIM     nemotron-3.5-super-vl-120b-a12b
#   aggregator  NVIDIA NIM     nemotron-3-ultra-550b-a55b  (550B total / 55B active)
#                              2026-10-19, on request. The ONE role that is
#                              deliberately not Super VL: a larger, different model
#                              that ACTS (writes the reply, runs the tool loop) on a
#                              MoA turn. Text-only -- see the moa: block.
#   fallback    OpenRouter     Qwen3.5-122B-A10B          1st link in fallback_providers
#               your laptop    Llama-3.3-Nemotron-Super-49B GGUF (Ollama)
#                                                         2nd link (offline, full strength)
#   floor       your laptop    Hermes-3-Llama-3.2-3B-abliterated:Q8_0 (Ollama)
#                              last link in fallback_providers, plus the five light
#                              auxiliary slots (title, approval, mcp, skills_hub,
#                              curator) -- kept off the NIM bucket on purpose
#   heavy aux   OpenRouter     Qwen3.5-122B-A10B          compression, web_extract
#   unrouted    Anthropic      claude-sonnet-5            anthropic-direct: configured,
#                              intact, reachable only via /model
#
# THE INVARIANT: one model per bucket. A slot may share the parent's provider only on
# the parent's exact model, and only vision among the auxiliaries may. Every fallback
# must sit on a different endpoint from the parent, because a 429 on NIM cannot be
# answered from NIM.
#
# WHY THE OPENROUTER ENTRY IS CALLED or-fallback.
# `deepseek` and `openrouter` are both in `excluded_providers` below.
# `excluded_providers` matches case-insensitively against every key a provider
# can surface under, so naming either directly -- `provider: deepseek`, or an
# entry called `openrouter` -- would be hidden by its own exclusion and silently
# resolve to the main model. Routing through a provider whose NAME is not
# excluded is what makes this work.
#
# VERIFY BEFORE TRUSTING, things this file cannot check:
#   1. That Ollama has actually pulled BOTH local models: the floor
#      (`hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0`) and
#      fallback-2 49B (`hf.co/unsloth/Llama-3_3-Nemotron-Super-49B-v1_5-GGUF:UD-Q8_K_XL`,
#      split GGUF, ~58.68 GB) — see the `local` provider's comment for the pull
#      commands. A model listed here but absent on the machine is exactly the
#      dangling reference CI rejects in config and cannot detect on disk.
#      scripts/hermes-verify.ps1 checks both local models.
#   2. That the box running `local` has the RAM/VRAM for the 49B GGUF when it is
#      called. It is fallback 2 only, so it only has to load on a failover. See the `local` provider's context_length comment for the
#      same caveat.
#   3. That NVIDIA_API_KEY can see BOTH NVIDIA models this file routes to --
#      the primary and the MoA aggregator:
#          bash scripts/nim-preflight.sh --list | grep -iE 'super-vl|ultra-550b'
#          curl -s https://integrate.api.nvidia.com/v1/models/nvidia/nemotron-3-ultra-550b-a55b
#      (no key; HTTP 200 = served, 410 = retired and the body gives the date)
#          NVIDIA_NIM_MODEL=nvidia/nemotron-3-ultra-550b-a55b bash scripts/nim-preflight.sh
#      A catalog that lists a model for one key can omit it for another, and the
#      public catalog listing says nothing about whether THIS key may call a 550B.
# ---------------------------------------------------------------------------

providers:
  nvidia-nim:
    name: "NVIDIA NIM (build.nvidia.com)"
    api: https://integrate.api.nvidia.com/v1
    key_env: NVIDIA_API_KEY
    transport: chat_completions
    # Run after every NVIDIA model swap -- a retired id answers HTTP 410, not a
    # config error:
    #     bash scripts/nim-preflight.sh --list | grep -i nemotron
    #
    # PRIMARY MODEL, 2026-10-19, on request: nvidia/nemotron-3.5-super-vl-120b-a12b
    # carries parent, subagents, MoA reference and vision (see model:, delegation:,
    # moa:, auxiliary.vision). The one other model routed to is the MoA AGGREGATOR,
    # nvidia/nemotron-3-ultra-550b-a55b (below). Everything else in this file is an
    # unrouted gateway kept intact on request (anthropic-direct), failover only
    # (or-fallback, local), or a deliberate non-NIM side job (see auxiliary:).
    #
    # LIVE-VERIFIED: GET https://integrate.api.nvidia.com/v1/models (no key needed)
    # returned HTTP 200 with 81 models on 2026-10-19 and listed exactly this id.
    # 120B total / ~12B active ("a12b"), hybrid Mamba-2 + MoE + attention,
    # vision-language (image, video, text in; text out), up to 1M tokens per the
    # model card. This id is THIS GATEWAY'S. The same weights carry other ids
    # elsewhere -- do not paste these into this entry:
    #     Vercel AI Gateway           nvidia/nemotron-3.5-super-vl
    #     Hugging Face / Baseten      nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B
    #     local served alias          nemotron-3.5-super-vl
    # A forum report says the hosted endpoint once answered under a different
    # model id than the one requested. UNVERIFIED -- scripts/nim-preflight.sh
    # probes this id and checks the reply names it.
    #
    # SAMPLING: NVIDIA's card recommends temperature 1.0, top_p 0.95; model:
    # below is set to match. Reasoning is toggled per request (`enable_thinking`),
    # not by a different id.
    #
    # ONE BUCKET. Parent, subagents, MoA reference, vision and the MoA aggregator
    # all spend this key's ~40 RPM together. The CI block requires any auxiliary or
    # delegation slot sharing the parent's provider to use the SAME model as the
    # parent. The MoA aggregator is the single sanctioned exception; CI requires it
    # to be listed here and to differ from every MoA reference. A fan-out can
    # starve the parent -- keep delegation.max_concurrent_children low, and see
    # credential_pool_strategies for adding a second key (same provider, fill_first).
    #
    # MOA AGGREGATOR: nvidia/nemotron-3-ultra-550b-a55b.
    # LIVE-VERIFIED the same way: GET /v1/models lists it, and GET /v1/models/<id>
    # (no key) returns HTTP 200 for BOTH NVIDIA ids in this file. That per-id
    # endpoint also says WHY an id is dead: HTTP 410 with the end-of-life date for
    # a retired model, 404 for one NIM never had. 550B total / 55B active, hybrid
    # Mamba-Attention LatentMoE, GA 2026-06-04, "up to 1M" context (256k default
    # serving config; not measured on this endpoint), OpenMDW-1.1. TEXT IN, TEXT
    # OUT: unlike Super VL it cannot take an image. Reasoning is ON by default
    # (`enable_thinking`, plus a cheaper `medium_effort`); NVIDIA samples it at
    # temperature 1.0, top_p 0.95 -- the same as the primary. Same id on OpenRouter
    # (`nvidia/nemotron-3-ultra-550b-a55b`); Hugging Face and Baseten spell it
    # `nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4`.
    #
    # NIM hosts nothing between 120B and 550B that can act as an aggregator: the
    # large Nemotrons are 120B (Super), 253B (Llama-3.1-Nemotron-Ultra, marked
    # Deprecated), 340B (Nemotron-4) and 550B. The one 235B Nemotron-named model
    # (nvidia/Qwen3-Nemotron-235B-A22B-GenRM) is a reward model that scores two
    # replies; it does not act or call tools.
    #
    # NOT MEASURED HERE: whether this key may call the 550B at all, its latency, and
    # whether NVIDIA gives it a lower rate cap than the 120B. Run the second
    # preflight command in the VERIFY block at the top of this file before relying
    # on it.
    #
    # `nvidia/nemotron-3-nano-omni-30b-a3b-reasoning` stays in `models:` for the
    # /model picker and is routed nowhere.
    default_model: nvidia/nemotron-3.5-super-vl-120b-a12b
    models:
      - nvidia/nemotron-3.5-super-vl-120b-a12b
      - nvidia/nemotron-3-ultra-550b-a55b
      - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    discover_models: false
    # nim-preflight.sh reports what the endpoint advertises. Set this to the number
    # it prints. The preflight defaults to the model above; NVIDIA_NIM_MODEL
    # overrides it if you need to probe a different one.
    #
    # CONTEXT LENGTH NOT RE-VERIFIED FOR nemotron-3.5-super-vl. 131072 is carried
    # over unchanged from the previous entry. The model card claims up to 1M tokens,
    # but a card is not an endpoint: raise this only to the number nim-preflight.sh
    # measures on this account. A value too LOW wastes window; too HIGH overflows
    # on a rejected request.
    context_length: 131072
    # NOT ENABLED. NVIDIA's cookbook says tool calling with reasoning on needs
    # `force_nonempty_content: true` in chat_template_kwargs, or `content` can
    # come back empty beside a tool call. Whether the HOSTED endpoint accepts
    # the field is unverified, and a rejection (HTTP 400/422) would fail every
    # turn on the only gateway. Run `bash scripts/nim-preflight.sh`; when its
    # "reasoning on + force_nonempty_content" probe prints `ok`, uncomment:
    # extra_body:
    #   chat_template_kwargs:
    #     force_nonempty_content: true

  or-fallback:
    name: "OpenRouter"
    api: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    transport: chat_completions
    # The 429 escape hatch, AND the workhorse for the two heavy auxiliary slots
    # (compression, web_extract). Both jobs land on one model on purpose.
    # context_length below has not been re-measured against Qwen's actual
    # OpenRouter listing; verify it and tool-call behaviour before trusting it.
    default_model: qwen/qwen3.5-122b-a10b
    models:
      - qwen/qwen3.5-122b-a10b
    discover_models: false
    # Held at the parent's window rather than the architectural million, for the
    # same reason: raise it to what the endpoint advertises, not the model card.
    context_length: 262144

  local:
    name: "Ollama (this machine)"
    # Ollama's OpenAI-compatible endpoint. `ollama serve` -> 11434.
    # Note this provider is named `local`, NOT `ollama`: `ollama` is in
    # excluded_providers below to hide the built-in catalog entry, and a provider
    # named the same as its own exclusion hides itself.
    api: http://127.0.0.1:11434/v1
    # Loopback only. No key_env because there is no key: a server on your own
    # machine authenticates nothing. The CI check that forbids inline keys exempts
    # loopback hosts for exactly this reason.
    api_key: "no-key-required"
    transport: chat_completions
    # PULLED VIA OLLAMA'S OWN HF-DIRECT FEATURE, not a manual GGUF download +
    # Modelfile:
    #     ollama pull hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
    # The full string becomes the model's tag in `ollama list` and is exactly
    # what belongs in `default_model`/`models:` below -- Ollama does not rename
    # it. Needs a reasonably current Ollama (the hf.co/ pull path); check
    # `ollama --version` if the pull is rejected. Q8_0 is 3,421,895,840 bytes
    # (~3.42 GB), checked against the Hugging Face repo 2026-09-25.
    #
    # "ABLITERATED" IS A REAL BEHAVIOR CHANGE, NOT A BRANDING DETAIL. This is a
    # refusal-removed fine-tune -- its safety training was deliberately ablated.
    # It backs every local-routed auxiliary slot below, `auxiliary.approval`
    # included. It is the auxiliary workhorse (see `auxiliary:` below): routing,
    # classification, short structured output, tool selection.
    default_model: hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
    models:
      - hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
      # Fallback 2 (offline, full strength). Split GGUF, 2 files, 58.68 GB combined,
      # checked via the Hugging Face Hub (unsloth/Llama-3_3-Nemotron-Super-49B-v1_5-GGUF).
      # `ollama pull hf.co/unsloth/Llama-3_3-Nemotron-Super-49B-v1_5-GGUF:UD-Q8_K_XL`
      # fetches both parts. Confirm the box has the VRAM/RAM before trusting this
      # line; the pull is assumed, not verified.
      - hf.co/unsloth/Llama-3_3-Nemotron-Super-49B-v1_5-GGUF:UD-Q8_K_XL
    discover_models: false
    # Llama-3.2-3B is text-only (Llama 3.2's vision variants are the 11B/90B line),
    # so there is no local vision. `auxiliary.vision` is cloud-routed; offline
    # vision does not exist in this build.
    #
    # KV cache is what hurts on a laptop, not the weights, so this sits far below
    # the model's native window. Raise it only as far as RAM tolerates. It was
    # sized for the 3B floor model; the 49B (fallback 2) shares it. 32768 is a
    # conservative floor that runs on both, not a measured optimum for the 49B.
    context_length: 32768

  anthropic-direct:
    name: "Anthropic (OpenAI-compatible endpoint)"
    #
    # NOT WIRED INTO ANY TIER. No parent, delegation, fallback, MoA or auxiliary
    # slot points here. Reachable only via
    # `/model custom:anthropic-direct:claude-sonnet-5`. Wiring it into a role is a
    # separate, deliberate edit.
    #
    # THIS ROUTES THROUGH ANTHROPIC'S OWN OPENAI-COMPATIBLE ENDPOINT, not a
    # third-party proxy and not the native Messages API. Anthropic ships a
    # `/v1/chat/completions` surface built for exactly this transport, alongside
    # the native `/v1/messages` used by the Anthropic SDKs.
    #
    # VERIFIED LIVE 2026-09-25 with no-credential probes against the real endpoint,
    # no real key ever sent:
    #   1. POST /v1/chat/completions, no auth header at all -> 401 with an
    #      OpenAI-shaped error body ({"error":{"code":...,"type":
    #      "invalid_request_error"}}). A garbage `Authorization: Bearer` token
    #      produces the SAME shape (still "invalid", not "missing header") --
    #      confirming the endpoint reads Bearer auth and answers in OpenAI's
    #      error schema, which is what this file's `chat_completions` transport
    #      needs from every provider it talks to.
    #   2. The SAME garbage token against `x-api-key` on the same path returns a
    #      DIFFERENT error shape ({"type":"error","error":{"type":
    #      "authentication_error", ...}}) -- Anthropic's native format. The
    #      endpoint auto-detects which header style you used and replies in the
    #      matching schema, which only a real compatibility shim does.
    #   3. For comparison, POST /v1/messages (the real native endpoint) with no
    #      auth returned "x-api-key header is required" -- a third, distinct
    #      response, proving /chat/completions is not just an alias of it.
    #
    # NOT VERIFIED, AND THE GAP IS REAL: GET /v1/models on this same host
    # answered a Bearer token with "invalid x-api-key" -- the completions path
    # accepts Bearer, the Models API does not. hermes-verify.ps1's catalog probe
    # is patched for this one provider (`-CatalogAuthHeader x-api-key`) because
    # of that finding; do not remove the override without re-testing this split.
    # Whether a REAL key's completion actually returns claude-sonnet-5 content
    # was never tested here -- no real credential exists in this environment, and
    # this file does not invent one. `hermes-verify.ps1 -Deep` is what closes
    # that gap, the same way it already does for the other three tiers.
    api: https://api.anthropic.com/v1
    key_env: ANTHROPIC_API_KEY
    transport: chat_completions
    default_model: claude-sonnet-5
    models:
      - claude-sonnet-5
    # Pin the picker to the line above, matching every other entry in this file.
    discover_models: false
    # Per the claude-api skill's model table: 1,000,000-token context, $2.00 / $10.00 per MTok in / out.
    # Held below the architectural ceiling for the same reason every provider
    # here is: this compat SHIM's own per-request window was never measured
    # against a real key, so raise this only once `-Deep` confirms what it
    # actually serves.
    context_length: 200000

  free-api:
    name: Free LLM API (OpenAI-compatible)
    api: https://api.example.com/v1
    key_env: CUSTOM_API_KEY
    transport: chat_completions
    default_model: free-llm
    models:
      - free-llm
    discover_models: false
    context_length: 131072
  # ---------------------------------------------------------------------------
  # FREELLM.NET FREE API PROVIDERS — all 24 providers from freellm.net/models/
  # NVIDIA NIM and OpenRouter already exist as `nvidia-nim` and `or-fallback`.
  # Cline is client-side (VS Code extension), no server endpoint — excluded.
  # API base URLs marked [UNVERIFIED] need confirmation against each provider's
  # docs before traffic is routed. Rate limits from freellm.net model table.
  # ---------------------------------------------------------------------------

  ollama-cloud:
    name: "Ollama Cloud"
    api: https://cloud.ollama.com/api
    key_env: OLLAMA_CLOUD_API_KEY
    transport: chat_completions
