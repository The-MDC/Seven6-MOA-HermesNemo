model:
  # Named-provider form. Routes by provider key rather than by model-name
  # detection — the detection path has an open bug where a model name matching
  # the OpenRouter catalog overrides an explicit custom base_url and sends your
  # key to a third party.
  #
  # NVIDIA NIM / nemotron-3.5-super-vl-120b-a12b is the primary (2026-10-19, on
  # request: "the nemotron 3.5 Super VL should be the only gateway and inference").
  # See the `nvidia-nim` provider entry for the live verification of this id, why it
  # differs from the same weights on other gateways, and what sharing one bucket
  # costs. The parent does not run offline: offline work degrades through
  # fallback_providers (below).
  provider: "custom:nvidia-nim"
  default: nvidia/nemotron-3.5-super-vl-120b-a12b
  # NVIDIA's model card: temperature 1.0, top_p 0.95.
  temperature: 1.0
  top_p: 0.95
  # base_url / api_key intentionally absent: the named provider (providers.nvidia-nim)
  # supplies the endpoint and key_env, so nothing here needs ${...} expansion.
  model_aliases:
    z-ai-glm-5-3:
      model: z-ai/glm-5.3
      provider: custom
  base_url: https://integrate.api.nvidia.com/v1
  api_mode: chat_completions
fallback_providers:
  # A 429 or an outage on the parent falls through to a different provider rather
  # than stopping. Every link below sits on a DIFFERENT bucket from the parent,
  # because a 429 on nvidia-nim cannot be answered from nvidia-nim (CI enforces it).
  #
  # FALLBACK 1 -- OpenRouter, Qwen3.5-122B-A10B. Independent bucket, cloud speed.
  # Matches `or-fallback`'s own default_model -- see that entry for why this id.
  - provider: custom
    model: qwen/qwen3.5-122b-a10b
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
  # FALLBACK 2 -- nvidia/nemotron-3.5-lightning-30b-a3b on NVIDIA NIM (matches the
  # same lightning fallback used on the default profile; fixed 2026-10-26 from a
  # mismatched provider/endpoint/key combo that pointed "openrouter" at a local
  # Ollama port with a cloud-scale model no 8GB machine could run).
  - provider: custom
    model: nvidia/nemotron-3.5-lightning-30b-a3b
  # FALLBACK 3 -- Hugging Face router. Live-verified 2026-10-26 against
  # router.huggingface.co: this id is real and served.
  - provider: huggingface
    model: deepseek-ai/DeepSeek-V4.1-Flash-1017
  # FALLBACK 4 -- Ollama Cloud. Fixed 2026-10-26: "gemma-4-31b-it" doesn't exist;
  # live-verified real id via /api/tags is "gemma4:31b".
  - provider: custom:ollama-cloud
    model: gemma4:31b
  # FALLBACK 5 -- OpenCode Zen (aggregator, built-in named provider). Added
  # 2026-10-26, key live-verified via /v1/models before writing this in.
  - provider: custom:opencode-zen
    model: deepseek-v4.1-flash-free
  # FALLBACK 6 -- Cloudflare Workers AI (aggregator). Added 2026-10-26; token
  # live-verified by running a real chat completion before writing this in
  # (the generic /user/tokens/verify endpoint 400s on this token's narrower
  # scope, but the actual Workers AI run endpoint works fine).
  - provider: custom
    model: "@cf/openai/gpt-oss-120b"
    base_url: https://api.cloudflare.com/client/v4/accounts/d266f6c59a542bce7394fb28b7580327/ai/run
    key_env: CLOUDFLARE_WORKERS_AI_API_TOKEN
delegation:
  # Subagents route by PROVIDER NAME, not by base_url. The documented
  # `delegation.base_url` path takes an inline `api_key` and otherwise falls back
  # to OPENAI_API_KEY only — there is no key_env for it — so using it would mean
  # either pasting a token into this file or having children authenticate as the
  # wrong account. Naming the provider resolves its key_env instead.
  #
  # SUBAGENTS SHARE THE PARENT'S PROVIDER AND MODEL: nemotron-3.5-super-vl-120b-a12b
  # is the only model this build routes inference to (except the MoA aggregator).
  # CI enforces the rule: a slot that shares the parent's provider must use the
  # parent's exact model.
  #
  # The cost is real: parent and children draw one ~40 RPM bucket, so a fan-out of N
  # children takes N/40ths of the parent's headroom. max_concurrent_children stays
  # at 3 for that reason -- do not raise it without a second NIM key
  # (credential_pool_strategies, fill_first).
  provider: "custom:nvidia-nim"
  model: nvidia/nemotron-3.5-super-vl-120b-a12b
  max_concurrent_children: 3
  # Empty on purpose: the children share the parent's provider, so there is nothing
  # different for them to fall back to that the parent's own chain does not cover.
  fallback_providers: []
# ---------------------------------------------------------------------------
# MIXTURE OF AGENTS
#
# HOW A MoA TURN RUNS (hermes-agent docs, "Mixture of Agents"): the AGGREGATOR is the
# ACTING model. It writes the reply, emits the tool calls and runs EVERY iteration
# of the tool loop. The reference models only
# ADVISE -- by default once per user turn (`fanout: user_turn`), with no tool
# schemas and without the Hermes system prompt. The aggregator is called once per
# iteration, the references once per turn.
#
# What that means for the one NIM bucket (~40 RPM, shared): on a MoA turn the
# aggregator takes the PARENT'S place for the tool loop, so the extra NIM
# requests over a plain turn are the reference calls -- one per user turn. Do not
# set `fanout: per_iteration` here: it re-runs the reference on every tool step.
#
# SAME PROVIDER, DIFFERENT MODEL. Reference and aggregator both sit on
# custom:nvidia-nim. CI enforces that the aggregator is a different MODEL from every
# reference, because a MoA whose aggregator is its own reference checks nothing.
# Honest limit: both are Nemotron 3 family (Super VL 120B-A12B, Ultra 550B-A55B), so
# this is a bigger-model check, not an independent-lineage one.
#
# TWO SHAPES, KEPT IN STEP. Current Hermes docs put reference_models and
# aggregator INSIDE each preset (moa.presets.<name>), chosen by
# moa.default_preset. Older Hermes reads the flat moa.reference_models /
# moa.aggregator keys. A preset with no aggregator has no acting model. Which shape
# the installed Hermes reads is not confirmed from here, so BOTH are written and CI fails if they disagree.
# Drop the flat pair once `hermes moa list` exists on the install (that command
# only exists on the preset schema).
# ---------------------------------------------------------------------------
moa:
  default_preset: default
  reference_models:
    # Reference model is the same id as the parent, subagents and vision (see the
    # `nvidia-nim` provider entry).
    # reasoning_effort: none on every slot below, 2026-10-25, on request -- see
    # the `agent:` block above for the live-verified timing this is based on.
    - provider: "custom:nvidia-nim"
      model: nvidia/nemotron-3.5-super-vl-120b-a12b
      enabled: true
      reasoning_effort: none
    - provider: nvidia-nim
      model: Cypherfox/GLM-5.3-Flash-dealignai-orcarouter-merge:IQ4_XS
      enabled: true
      reasoning_effort: none
    - provider: nvidia
      model: unsloth/GLM-5.3-Flash-GGUF:Q8_0
      enabled: true
      reasoning_effort: none
    - provider: nvidia
      model: Unsloth/Nemotron-3.5-Super-VL-120B-A12B-Q8_0
      enabled: true
      reasoning_effort: none
  aggregator:
    # NVIDIA NEMOTRON 3 ULTRA 550B-A55B, 2026-10-19, on request. Why this id is in
    # the `nvidia-nim` provider entry beside the live catalog check.
    #
    # WHAT YOU GIVE UP vs the 120B, stated plainly:
    #   - TEXT ONLY. Super VL takes images and video; Ultra does not. On a MoA turn
    #     the acting model is this one, so an attached image reaches it as a file
    #     path, not pixels (Hermes' MCP docs: "Text-only models get the path
    #     only"). `vision_analyze` still routes to Super VL via auxiliary.vision.
    #   - ~4.6x the active parameters per token (55B vs 12B), so expect slower,
    #     costlier calls. Ultra reasons by default, which adds latency; Hermes has a
    #     per-slot `reasoning_effort`. 2026-10-25, on request: set to "none" below,
    #     live-verified against NIM (see `agent:` block above) rather than left
    #     UNVERIFIED as the prior note here said.
    #   - No local copy: 550B needs ~4x B200 or 8x H100 to self-host. The offline
    #     tier is the 49B (fallback 2), not this.
    #
    # STILL NOT anthropic-direct, and the original reasoning still holds: every
    # MoA turn would carry a metered $2/$10-per-MTok aggregator on a config whose
    # thesis is that requests (not money) are the scarce resource. If you want
    # Claude here it is a one-line deliberate edit (provider
    # "custom:anthropic-direct", model claude-sonnet-5) -- in BOTH shapes below.
    #
    # TO MOVE THIS OFF THE NIM BUCKET: OpenRouter serves the same id
    # (`nvidia/nemotron-3-ultra-550b-a55b`, $0.50/$2.20 per MTok, 262K paid).
    # Set provider "custom:or-fallback" in BOTH shapes and add the id to that
    # provider's `models:` list -- CI rejects an aggregator id its provider does
    # not list, since discover_models:false turns a wrong id into a silent
    # fallback to the main model, not an error.
    provider: "nvidia"
    model: nvidia/nemotron-3.5-super-vl-120b-a12b
    reasoning_effort: none
  presets:
    default:
      enabled: true
      reference_models:
        - provider: "custom:nvidia-nim"
          model: nvidia/nemotron-3.5-super-vl-120b-a12b
          enabled: true
          reasoning_effort: none
        - provider: nvidia-nim
          model: Cypherfox/GLM-5.3-Flash-dealignai-orcarouter-merge:IQ4_XS
          enabled: true
          reasoning_effort: none
        - provider: nvidia-nim
          model: unsloth/GLM-5.3-Flash-GGUF:Q8_0
          enabled: true
          reasoning_effort: none
        - provider: nvidia-nim
          model: Unsloth/Nemotron-3.5-Super-VL-120B-A12B-Q8_0
          enabled: true
          reasoning_effort: none
      aggregator:
        provider: "nvidia-nim"
        model: nvidia/nemotron-3.5-super-vl-120b-a12b
        reasoning_effort: none

# ---------------------------------------------------------------------------
# RESEARCH BROWSER
#
# SearXNG is the free half: self-hosted metasearch over 70+ engines, no API key,
# no rate limit. It is SEARCH-ONLY — no extract, no crawl — so it is paired with
# an extractor.
#
# Setting search_backend explicitly is load-bearing. Hermes' auto-detection walks
# Firecrawl > Parallel > Tavily > Exa > SearXNG > Brave > DDGS, so merely having
# FIRECRAWL_API_KEY in the environment silently wins over SearXNG and you never
# find out your "free local search" is billing an API.
#
# Run one:  docker run -d -p 8888:8080 --name searxng searxng/searxng
# Then:     SEARXNG_URL=http://127.0.0.1:8888   in ~/.hermes/.env
# ---------------------------------------------------------------------------
      degraded_reference_policy: loud
      fanout: user_turn
  degraded_reference_policy: loud
  fanout: user_turn
  enabled: true
web:
  search_backend: ddgs
  extract_backend: firecrawl

# ---------------------------------------------------------------------------
# KEEPING THE PICKER CLEAN
#
# 1. Live discovery. Every provider sets `discover_models: false`, so the picker
#    shows the models configured on that entry rather than everything the endpoint
#    advertises. Listing `models:` alone does not do this.
# 2. Hermes' built-in provider catalog, which surfaces independently of anything
#    configured here. `excluded_providers` hides those.
#
# `openrouter` and `ollama` are load-bearing rather than cosmetic: this config
# actually uses both, through providers named `or-fallback` and `local`. That
# indirection is the point: exclusion matches every key a provider surfaces
# under, so an entry named after its own exclusion would hide itself.
#
# `deepseek` stays excluded defensively: it blocks Hermes' own built-in `deepseek`
# catalog entry from surfacing by drift, and nothing here routes to it.
#
# `openai-codex` is excluded for a different reason than the rest. It is not
# clutter — it is a working provider (ChatGPT/Codex OAuth) that must never be
# turned on here. Hermes also delegates coding tasks to the Codex CLI as a
# subprocess (docs/models/codex-handoff.md), and that CLI reads its own OAuth
# token from ~/.codex/auth.json against the SAME ChatGPT 5-hour usage window this
# provider would draw from ~/.hermes/auth.json. Two consumers of one quota,
# invisible to each other. CI asserts this entry stays present.
#
# Switching mid-session, with the names as they now stand:
#   /model custom:nvidia-nim:nvidia/nemotron-3.5-super-vl-120b-a12b                      (the parent)
#   /model custom:nvidia-nim:nvidia/nemotron-3-ultra-550b-a55b                           (the MoA aggregator; text-only)
#   /model custom:nvidia-nim:nvidia/nemotron-3-nano-omni-30b-a3b-reasoning               (listed, unrouted)
#   /model custom:or-fallback:qwen/qwen3.5-122b-a10b
#   /model custom:local:hf.co/unsloth/Llama-3_3-Nemotron-Super-49B-v1_5-GGUF:UD-Q8_K_XL   (fallback 2, offline)
#   /model custom:local:hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
#   /model custom:anthropic-direct:claude-sonnet-5       (needs ANTHROPIC_API_KEY)
# ---------------------------------------------------------------------------
excluded_providers:
  # EXACT LOWERCASE SET MATCH, NOT SUBSTRING (hermes-agent source): hermes_cli/model_switch_providers.py builds
  # `excluded={str(p).strip().lower() for p in excluded_providers}`. So `google` does
  # NOT cover `gemini`, and `openai-codex` does NOT cover `codex`. Every alias has to
  # be listed by name.
  #
  # Every alias has to be listed. The source defines
  # _GEMINI_NATIVE_PROVIDER_NAMES = {"gemini", "google", "google-gemini",
  # "google-ai-studio"} and _GOOGLE_PROVIDER_NAMES adds {"vertex", "google-vertex",
  # "vertex-ai"} -- only one of those seven was excluded. Separately,
  # _VISION_AUTO_PROVIDER_ORDER = ("openrouter", "nous", "deepinfra") names deepinfra
  # as a provider auxiliary VISION can auto-select, and it was not excluded either.
  #
  # Listing a name that is already covered costs nothing. Missing one puts a model in
  # the picker that no tier owns, on a bucket nothing here accounts for.
  - openrouter
  - anthropic
  - openai
  - openai-codex
  - codex
  - copilot
  - google
  - gemini
  - google-gemini
  - google-ai-studio
  - vertex
  - google-vertex
  - vertex-ai
  - mistral
  - deepseek
  - groq
  - cerebras
  - xai
  - minimax
  - ollama
  - lmstudio
  - nous
  - deepinfra
  - bedrock
  - together
  - fireworks
  - perplexity
  - moonshot
  - qwen
  - cohere
  - novita
  - nebius
  - azure

# ---------------------------------------------------------------------------
# VOICE — jamiepine/hermes-voicebox
#
# IT IS A BRIDGE, NOT AN ENGINE. The plugin talks to the Voicebox app, which has
# to be running locally — desktop build on :17493, Docker on :17600. Installing
# the plugin alone does nothing, which is the easiest way to be confused by it.
#
#   pip install hermes-voicebox        # into the env Hermes runs in
# ---------------------------------------------------------------------------
tts:
  provider: voicebox

stt:
  provider: voicebox

# ---------------------------------------------------------------------------
# MCP — TOOL-FILTERED, AND MOSTLY LOCAL
#
# Hermes reads MCP servers from HERE, not from `.mcp.json` (that file is Claude
# Code's).
#
# `tools.include` is the part that matters for throughput. Every MCP tool Hermes
# discovers is injected into the system prompt on EVERY request. An unfiltered
# server with 40 tools is a permanent tax on every bucket at once. Name only what
# you call. `hermes mcp configure <name>` reopens the checklist to widen it later.
#
# TWO HOSTED SERVERS ARE ALLOWED HERE, and they are the exception rather than the
# rule. CI enforces an explicit allowlist (`cloudflare`, `submcp`) instead of the
# blanket loopback-only rule: a hosted MCP costs a round trip per
# call and prompt space on every request, so each one has to be named in CI on
# purpose rather than added by drift. Everything not on that list must still be
# loopback or a local subprocess.
#
# EVERY server below sets `prompts: false` and `resources: false`. Hermes registers
# four utility tools per server (list/read resources, list/get prompts) unless told
# not to, and nothing here calls them. CI enforces both keys on every server.
# `unfiltered: true` is NOT a Hermes key: the source ignores it, and with neither
# include nor exclude set Hermes registers every tool. It is this repo's marker so CI
# can tell a reviewed opt-out from an unnoticed one.
#
# `render` is deliberately ABSENT. Its endpoint (mcp.render.com) failed DNS
# repeatedly, and the config it was configured in carried an INLINE bearer token.
# Rotate that token in the Render dashboard before re-adding this entry, and read
# it from the environment when you do.
# ---------------------------------------------------------------------------
mcp_servers:
  # Voicebox's own MCP server, for agent-invoked voice tools rather than Hermes'
  # tts/stt plumbing. Loopback, no key.
  voicebox:
    url: "http://127.0.0.1:17493/mcp"
    tools:
      prompts: false
      resources: false
      # Explicitly unfiltered. Voicebox has never been started in this
      # environment, so its tool names are unknown here and a guessed
      # include-list would filter everything out and silently break voice. Run
      # it, then `hermes mcp configure voicebox` and replace this with the real
      # list. The flag exists so CI can tell a reviewed opt-out from an
      # unnoticed one.
      unfiltered: true

  # Self-hosted extraction. Pairs with `web.extract_backend`: SearXNG searches,
  # Crawl4AI reads. Keyless, loopback, and unlike Firecrawl it never leaves the
  # machine.
    enabled: false
  crawl4ai:
    url: "http://127.0.0.1:11235/mcp/sse"
    tools:
      prompts: false
      resources: false
      include:
        - crawl
        - scrape

  # Cross-session recall. Reviewed: telemetryCollection is declared, defaulted
  # and never read — it gates no network call.
    enabled: false
  atomicmemory:
    command: "npx"
    args: ["-y", "@atomicmemory/mcp-server"]
    tools:
      prompts: false
      resources: false
      include:
        - store_memory
        - search_memory
        - list_memories

  # The packaged Hermes/Codex skills server. Local subprocess, no network.
  # Set HERMES_SKILLS_SERVER to the built entrypoint — on the Windows box that is %LOCALAPPDATA%\hermes\skills-mcp-server\dist\index.js. Do not
  # hardcode a per-machine path in a file that gets copied between machines.
  hermes-skills:
    command: "node"
    args: ["${HERMES_SKILLS_SERVER}"]
    tools:
      prompts: false
      resources: false
      include:
        - list_skills
        - get_skill
        - search_skills

  # Multi-perspective review. Local subprocess.
  #
  # The Hermes supervisor SUBSTITUTES ITS OWN BUNDLED PYTHON when it launches a
  # `command:` entry that names a Python interpreter. The symptom:
  #     ModuleNotFoundError: No module named 'mcp.server.fastmcp'
  # which reads as a dependency fault and is not one: hermes_council imports
  # cleanly under the interpreter it was installed into; the supervisor was running
  # a different Python than the one holding the packages. Do not debug package
  # versions in the venv.
  #
  # The fix is indirection the supervisor cannot reach through. `command` names a
  # LAUNCHER; the launcher pins the absolute interpreter internally.
  # scripts/hermes-council-launch.cmd refuses to run rather than guess an
  # interpreter -- a silent fallback is the whole bug class.
  #
  # THE SAME EXPOSURE APPLIES TO EVERY `command:` ENTRY. atomicmemory (npx) and
  # hermes-skills (node) are the other two; a substituted Node fails the same way
  # and just as misleadingly. The `url:` entries --
  # voicebox, crawl4ai, and the two hosted servers -- are immune, because the
  # supervisor connects to them rather than launching them.
  hermes-council:
    command: "${HERMES_COUNCIL_LAUNCHER}"
    args: []
    tools:
      prompts: false
      resources: false
      include:
        - council_review
        - council_perspectives

  # Codex, as TOOLS rather than as a shell string.
  #
  # `codex mcp list` reports Unsupported and always will: Codex 0.154.0 removed the
  # mcp-server entry point and Codex is an MCP CLIENT now. This is the
  # interface rebuilt locally -- scripts/codex-mcp/server.js, dependency-free, talking
  # newline-delimited JSON-RPC over stdio.
  #
  # It does NOT make Codex an inference provider. `openai-codex` stays excluded below,
  # because that provider and the CLI draw on the same ChatGPT 5-hour window from two
  # different token files. This wraps the subprocess the bundled skill already drives;
  # it adds no second consumer of that quota.
  #
  # LAUNCHER, not a bare `node`, for the reason spelled out on hermes-council: the
  # supervisor substitutes its own runtime for a `command:` entry, and a substituted
  # Node fails exactly as misleadingly as a substituted Python. Set
  # HERMES_CODEX_LAUNCHER to scripts\codex-mcp-launch.cmd and HERMES_CODEX_NODE to the
  # node.exe it should pin; the launcher refuses rather than guessing.
    enabled: false
  codex-mcp:
    command: "${HERMES_CODEX_LAUNCHER}"
    args: []
    tools:
      prompts: false
      resources: false
      include:
        - codex_exec
        - codex_status

  # HOSTED — allowlisted. Every call is a round trip off-box.
  # Disabled 2026-10-26: no OAuth ever completed for this connector, so every
  # attempt 401s and retries every ~5s, forever, every day -- confirmed in
  # errors.log and directly implicated in the gateway-ticket-bootstrap cascade
  # failures seen right after boot. Re-enable once mcp.cloudflare.com is
  # actually authenticated.
  cloudflare:
    url: "https://mcp.cloudflare.com/mcp"
    tools:
      prompts: false
      resources: false
      include:
        - workers_list
        - workers_get
        - kv_list

  # HOSTED — allowlisted. Sub-agent MCP aggregator.
  # Disabled 2026-10-26: TLS handshake fails (TLSV1_UNRECOGNIZED_NAME) on every
  # attempt -- mcp.submcp.com is unreachable/misconfigured, same daily retry
  # drain as cloudflare above.
    enabled: false
  submcp:
    url: "https://mcp.submcp.com/mcp"
    tools:
      prompts: false
      resources: false
      unfiltered: true

# TOOL SEARCH — pinned, not newly enabled.
#
# Checked against the Hermes source (upstream main, 2026-10-19): `tools.tool_search`
# defaults to "auto", which activates whenever any deferrable tool exists, and every
# `mcp-*` tool is deferrable. The model sees a short bridge (tool_search /
# tool_describe / tool_call) plus a name-and-first-sentence listing instead of every
# MCP schema. Pinning "on" means a future change to the upstream default cannot
# silently put all MCP schemas back into every request on a 12B-active model with a
# 131k window and ~40 RPM. The budget numbers below are Hermes' own defaults, written
# out so they are visible; nothing in this repo measured better ones. `defer` is left
# unset on purpose: an explicit list REPLACES the curated default wholesale.
# Installed Hermes version unconfirmed: an older build ignores this block harmlessly,
# and `hermes config check` shows whether yours knows the key.
    enabled: false
  context7:
    url: https://mcp.context7.com/mcp
    enabled: false
tools:
  tool_search:
    enabled: "on"
    listing: "auto"
    threshold_pct: 5
    listing_max_tokens: 4000
    search_default_limit: 5
    max_search_limit: 25

# ---------------------------------------------------------------------------
# THROUGHPUT — everything below exists to buy requests, not to save money
# ---------------------------------------------------------------------------

# AUXILIARY MODELS — the largest single win across all three constraints.
#
# Hermes has TWO kinds of model slot. The main model is what it thinks with.
# Auxiliary models are eleven side-jobs it offloads: context compression, vision,
# web-page summarisation, approval scoring, MCP tool routing, session titles,
# skill search, curator review, and the Kanban trio.
#
# EVERY auxiliary slot defaults to `auto`, and `auto` means "use the main model."
# Left alone, a 1.6T model at 1M context writes your session titles, on the
# parent's own bucket, competing with the conversation for it.
#
# THE SPLIT BELOW IS NOT UNIFORM, and the reason matters.
#
# The local model (Hermes-3-Llama-3.2-3B-abliterated:Q8_0 -- local, free,
# unmetered, no rate limit) takes the slots a small model is genuinely strong at: routing, classification,
# tool selection, short structured output. That is five of the seven, and it
# costs nothing at any volume.
#
# compression and web_extract do NOT go there. Both are long-form summarisation,
# and compression in particular REWRITES conversation history — a bad compaction
# is unrecoverable and silently degrades everything after it. Summarising a
# 262k-token context down to 20% is not a job for a model this size. Those two go
# to or-fallback, which is a third bucket, so they compete with neither the
# parent nor the subagents.
#
# Left on `auto` deliberately: the three Kanban slots (unused — no board
# configured). Vision is PINNED, not auto -- see its own comment below for why
# `auto` is unsafe here specifically.
auxiliary:
  compression:
    provider: "custom:nvidia-nim"
    model: nvidia/nemotron-3.5-lightning-30b-a3b
  web_extract:
    provider: "custom:nvidia-nim"
    model: nvidia/nemotron-3.5-lightning-30b-a3b
  # VISION: nemotron-3.5-super-vl-120b-a12b. The "VL" in that id is the point: it is
  # a vision-language model (image, video and text in), so the parent can see and
  # this slot needs no separate image-only model. The id is live-verified (see the
  # `nvidia-nim` provider entry).
  #
  # PINNED, NEVER `auto`: `auto` means "use the main model", so an image task would
  # silently follow every future parent change -- including to one with no vision
  # encoder -- and report a bad answer rather than a missing capability. The local
  # floor model is text-only too (Llama 3.2's vision variants are the 11B/90B
  # line), and this slot is cloud-only: vision fails with no network.
  #
  # This slot shares the parent's provider and model on purpose; the CI block
  # allows exactly that, and nothing else on the parent's provider. The other
  # auxiliary slots stay OFF the NIM bucket (compression/web_extract on or-fallback,
  # the five 3B local slots below): they are frequent, and each one is a request
  # taken from the parent's ~40 RPM.
  vision:
    provider: "custom:nvidia-nim"
    model: nvidia/nemotron-3.5-super-vl-120b-a12b
  title_generation:
    provider: "custom:nvidia-nim"
    model: nvidia/nemotron-3.5-lightning-30b-a3b
    prefer_fast_model: true
  approval:
    provider: "custom:nvidia-nim"
    model: nvidia/nemotron-3.5-lightning-30b-a3b
  mcp:
    provider: "custom:nvidia-nim"
    model: nvidia/nemotron-3.5-lightning-30b-a3b
  skills_hub:
    provider: "custom:nvidia-nim"
    model: nvidia/nemotron-3.5-super-vl-120b-a12b
    base_url: https://integrate.api.nvidia.com/v1
    reasoning_effort: max
  curator:
    provider: "custom:nvidia-nim"
    model: nvidia/nemotron-3.5-lightning-30b-a3b

# execute_code — the single largest win available.
#
# The agent writes a Python script that calls Hermes tools over an RPC socket.
# Intermediate tool results NEVER enter the context window; only the script's
# final print() comes back. A search -> extract -> filter -> summarise pipeline
# that costs four inference round trips collapses into ONE.
#
# `project` mode runs in the session's working directory with the active venv, so
# `import pandas` and relative paths behave as they do in terminal(). `strict`
# quarantines to a temp dir with Hermes' own interpreter — more reproducible, less
# useful. Security is identical either way: credentials are scrubbed, and scripts
# cannot call execute_code recursively, delegate_task, or any MCP tool.
code_execution:
  mode: project
  timeout: 300
  max_tool_calls: 50

# Compression — threshold RAISED, which is the counter-intuitive half.
#
# Default is 0.50: compact once the context passes half the window. Raising it
# wins on ALL THREE constraints at once:
#
#   requests — every compaction is itself an inference call
#   money    — compaction REWRITES history, so it invalidates the provider prompt
#              cache. The next request re-reads the whole conversation at full
#              input price instead of the cached rate, which Hermes' own docs put
#              at a 75-90% discount.
#   tokens   — that re-read is the single largest token event in a session
#
# The naive reading is "compact early to save tokens." It is wrong: compacting
# early spends a request and destroys the cache to shrink a context that was being
# billed at a tenth of the price.
#
# Do NOT raise the threshold much past 0.70: provider-proven overflow costs
# a rejected request plus a bounded recovery pass, which is worse than the
# compaction it avoided.
#
# The key is a SUBSTRING match against the model id, longest key wins.
compression:
  enabled: true
  threshold: 0.50          # global default, unchanged
  model_thresholds:
    # Fallback 2 (the local 49B). The CI check requires a threshold keyed to the
    # parent, and a model that compacts at the global 0.50 default is the quiet
    # failure this block exists to stop. 0.65, not higher: providers.local.
    # context_length is 32768, so there is little room to defer compaction into.
    # Re-tune once that number is re-tuned for the 49B.
    "Nemotron-Super-49B-v1_5": 0.65
    # PARENT: nemotron-3.5-super-vl-120b-a12b on NIM. The CI check resolves a key
    # against the parent id by case-insensitive substring, longest key wins, so
    # this one has to be a substring of the parent id.
    #
    # 0.70: every compaction costs a request out of a shared ~40 RPM bucket, and it
    # rewrites history, which resets any provider-side prompt cache. Held below the
    # 0.80 ceiling CI enforces. Computed against the CONFIGURED window
    # (providers.nvidia-nim.context_length = 131072, not re-measured), so 0.70 is
    # ~91.7k tokens before the first compaction. Re-tune once that number is
    # measured with scripts/nim-preflight.sh.
    "nemotron-3.5-super-vl": 0.70
    # MOA AGGREGATOR: nemotron-3-ultra-550b-a55b. On a MoA turn the
    # aggregator is the ACTING model for the whole tool loop (Hermes docs), so it
    # is the model whose window compacts -- a key matching only the parent would
    # leave it on the global 0.50 default. Same reasoning and same number as the
    # primary: same bucket, same configured window (providers.nvidia-nim.
    # context_length = 131072, not measured for this model), and CI requires the
    # key, so removing it fails the build instead of passing silently.
    "nemotron-3-ultra": 0.70
  target_ratio: 0.20
  tail_mode: lean
  protect_last_n: 20

context:
  engine: "compressor"     # built-in. Pinned so a plugin cannot silently take over.

# Credential pools — same-provider key rotation.
#
# A pool registers several keys for ONE provider and rotates on 429/402/401
# instead of failing over to a different provider. Pools are tried BEFORE
# fallback_providers, so a second key keeps the tier serving where today a 429
# drops it a level.
#
#     hermes auth add nvidia-nim --api-key nvapi-<second key>
#     hermes auth list
#
# STRATEGY: fill_first, deliberately — NOT round_robin.
#
# Provider prompt caches are scoped per API key. Rotating keys mid-session throws
# the cached prefix away and the next request re-reads the whole conversation at
# undiscounted input price. round_robin rotates on EVERY selection and would pay
# that constantly. fill_first uses one key until it is genuinely exhausted — one
# cache reset per exhaustion, not one per request.
credential_pool_strategies:
  nvidia-nim: fill_first
  or-fallback: fill_first

# Provider routing — OpenRouter ONLY. No effect on NIM or the local tier, so it
# shapes exactly one tier: `or-fallback`, which serves both the 429 escape and
# the two heavy auxiliary slots.
#
# sort: throughput because we reach that tier when something upstream is already
# slow or refusing. require_parameters so a reseller that silently drops `tools`
# or `temperature` is never selected — a fallback that quietly loses tool-calling
# is worse than the 429 it replaced.
provider_routing:
  sort: "throughput"
  require_parameters: true
  data_collection: "deny"

# ---------------------------------------------------------------------------
# PROMPT CACHING
#
# Every key below was verified present in the hermes-agent source -- `prompt_caching`
# and `cache_ttl` resolve in 14 and 11 source files respectively -- because a config
# key that nothing reads is a silent failure.
#
# WHY "1h" AND NOT THE "5m" DEFAULT. The upstream comment says to use 1h "for long
# sessions with pauses between turns", which is precisely the shape of this build:
# a takeover runbook run step by step, with a human reading output between steps.
# At 5m the cache expires during the reading, and the parent re-sends a 1M-context
# prompt it had already paid to cache.
# ---------------------------------------------------------------------------
prompt_caching:
  cache_ttl: "1h"

# ---------------------------------------------------------------------------
# TOOL LOOP GUARDRAILS
#
# A model that cannot make a tool call work will try again, and the default posture
# is to warn rather than stop. That is right at a terminal, where a human sees the
# warning. It is wrong for anything this build delegates -- subagents on NIM, Codex
# runs through the MCP shim -- because nobody is watching and a loop burns the
# shared NIM rate-limit bucket (the parent's too) until the
# task times out.
#
# `non_interactive_hard_stop_enabled` is the key that matters here and it is ALREADY
# true upstream; it is written out explicitly rather than inherited so that a future
# upstream default change cannot quietly turn it off.
# ---------------------------------------------------------------------------
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false            # interactive: warn, let the human judge
  non_interactive_hard_stop_enabled: true   # delegated: stop, nobody is watching
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

# ---------------------------------------------------------------------------
# SKILLS
#
# `external_dirs` is the most useful thing found in the upstream reference and it is
# LEFT COMMENTED ON PURPOSE, because turning it on changes how this repo is
# installed and that is the owner's call, not a default.
#
# Today TAKEOVER step 3.4 copies hermes-skills/* into ~/.hermes/skills/. That copy is
# a fork the moment it lands: a `git pull` in the repo does not reach it, and nothing
# reports the drift. external_dirs points Hermes at the checkout instead -- read-only,
# so skill creation still writes to ~/.hermes/skills/ -- and the skills a `git pull`
# brings in are live with no second step.
#
# The trade is that the checkout must exist wherever Hermes runs, and a deleted or
# moved repo silently removes every skill. Decide deliberately; do not just uncomment it.
# ---------------------------------------------------------------------------
skills:
  # Every N tool-calling iterations, nudge the model to consider saving a skill.
  # 0 disables. Left at the upstream default rather than tuned blind.
  creation_nudge_interval: 15
  # external_dirs:
  #   - ${HERMES_BUILD_REPO}/hermes-skills
  disabled: []
_config_version: 52
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
browser:
  use_real_profile: true
plugins:
  enabled:
    - accent-picker
    - advanced-delegation
    - camofox
    - disk-cleanup
    - gbrain-plugin
    - gbrain-pointer
    - gbrain-retrieval-reflex
    - github-copilot
    - hermes-cloud-file-manager
    - hermes-dreaming
    - hindsight
    - mcp-serve
    - memory-wiki
    - openviking
    - promoat
    - security-guidance
    - voicebox
  disabled: []
display:
  message_reactions: true
local_runtime:
  enabled: true
approvals:
  mode: manual
agent:
  reasoning_effort: xhigh
platform_toolsets:
  cli:
    - a2a
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - file
    - image_gen
    - kanban
    - memory
    - promoat
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
known_plugin_toolsets:
  cli:
    - a2a
    - promoat
known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
command_allowlist:
  - shell command via -c/-lc flag
