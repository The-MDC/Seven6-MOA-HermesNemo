      - BAAI/bge-m3
    discover_models: false
    context_length: 409600
    # Rate: ~1M tokens/month (shared, varies by model) [UNVERIFIED base URL]

  google-gemini:
    name: "Google Gemini"
    api: https://generativelanguage.googleapis.com/v1beta
