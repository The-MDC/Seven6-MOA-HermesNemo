    context_length: 1048576
    # Rate: Session/weekly limits (unpublished)

  kilo-code:
    name: "Kilo Code"
    api: https://ai-gateway.kilo.ai/api/v1
    key_env: KILO_CODE_API_KEY
    transport: chat_completions
    default_model: inclusionai/ling-3.1-flash
    models:
      - inclusionai/ling-3.1-flash
